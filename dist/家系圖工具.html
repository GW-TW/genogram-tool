<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Jxm4BzRi66kqbNRN5FIEVXbiRbTCAtB/MROLKP4gzBA=' 'sha256-yAA+EttaQzHmgL+TCmQY7AnpgdXv3/3INBGYRgVMJ2U=' 'sha256-KPAWntUk/JgbOjyza5K+F7UtI8a7v05G1BFhHF0CoMg=' 'sha256-Ri4ic0Py8pZlvQM18i79IGpVzEfN46qv55Ub7B4qOJg='; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家系圖工具</title>
<style>
/* 家系圖工具 — 樣式（配色與元件規則＝共用設計系統 UI_Design.md） */
:root {
  --brand: #2E86AB; --brand-dark: #227AA0; --brand-deep: #1B5E7E; --cyan: #38BDF8; --cyan-soft: #7DD3FC;
  --bg: #EEF4F8; --card: #FFFFFF; --border: #D6E3EC; --ink: #173F52; --ink-soft: #5B7688; --muted: #8AA2B1;
  --field: #F7FAFC; --ok: #12855A; --warn: #B26A00; --warn-bg: #FCF4E6; --heart: #E23A3A;
  --font: 'Microsoft JhengHei UI', 'Microsoft JhengHei', '微軟正黑體', 'Noto Sans TC', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* 元件自己的 display 不可以蓋掉 hidden 屬性 */
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--bg);
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}

/* ── 標題列（水平漸層：深→亮青）── */
.topbar {
  background: linear-gradient(90deg, var(--brand-deep), var(--brand) 55%, var(--cyan));
  color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.brand .file { font-size: 13px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
.brand .file .dirty { color: #FFE08A; font-weight: 700; }
.filebar { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.filebar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.35); margin: 0 4px; }
.topbar button {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.38); color: #fff; font-weight: 700;
}
.topbar button:hover { background: rgba(255,255,255,.26); border-color: #fff; }
.topbar button.primary { background: #fff; color: var(--brand-deep); border-color: #fff; }
.topbar button.primary:hover { background: #E6F6FE; }

/* ── 主版面：左工具／中畫布／右屬性 ── */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr) 312px; min-height: 0; }
.tools, .props { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.props { border-left: 1px solid var(--border); }
.tools { border-right: 1px solid var(--border); }

.card {
  background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--brand);
  border-radius: 6px; padding: 10px 12px;
}
.card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.card h3 .right { margin-left: auto; font-weight: 400; color: var(--ink-soft); font-size: 12px; }
.badge {
  width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff;
  font-size: 11px; display: inline-grid; place-items: center; flex: none;
}
.card.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.card.danger { border-left-color: var(--heart); }
.muted { color: var(--muted); font-size: 12px; }
.soft { color: var(--ink-soft); font-size: 12px; }
.hint-text { color: var(--ink-soft); font-size: 12px; line-height: 1.5; margin: 6px 0 0; }

/* ── 按鈕（hover 稍亮、disabled 轉灰）── */
button {
  font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; color: var(--ink); padding: 6px 10px; line-height: 1.2;
}
button:hover { border-color: var(--cyan-soft); background: #F4FBFF; }
button:active { background: #E6F4FB; }
button:disabled { opacity: .45; cursor: not-allowed; background: #fff; border-color: var(--border); }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
button.primary:hover { background: var(--brand-dark); }
button.secondary { color: var(--brand); border-color: var(--brand); font-weight: 700; }
button.danger { color: var(--heart); border-color: var(--heart); }
button.danger:hover { background: #FDECEC; }
button.link { border: none; background: none; color: var(--brand); padding: 2px 4px; text-decoration: underline; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 6px; }

/* 新增人物大按鈕（含符號圖示） */
.addbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-weight: 700; }
.addbtn svg { width: 26px; height: 26px; }

/* ── 表單 ── */
label.field { display: block; font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
label.field:first-child { margin-top: 0; }
label.field .tag { font-size: 11px; color: var(--ok); border: 1px solid var(--ok); border-radius: 8px; padding: 0 5px; margin-left: 4px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  font: inherit; background: var(--field); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px; color: var(--ink); width: 100%;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(56,189,248,.25); }
input:disabled { color: var(--ink-soft); background: #EEF2F5; }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; cursor: pointer; }
.check input { accent-color: var(--brand); width: 15px; height: 15px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: none; border-radius: 0; border-right: 1px solid var(--border); padding: 6px 0; }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--brand); color: #fff; font-weight: 700; }
.agehint { font-size: 12px; color: var(--ok); margin-top: 3px; min-height: 16px; }
.agehint.warn { color: var(--warn); font-weight: 700; }
.pill {
  display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 700;
  background: var(--brand); color: #fff;
}
.pill.warn { background: var(--warn); }
.kin { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
.kin b { color: var(--ink); font-weight: 700; }
.childrow { display: grid; grid-template-columns: 1fr 88px; gap: 6px; align-items: center; margin: 4px 0; font-size: 13px; }

/* ── 畫布 ── */
.stage { position: relative; min-width: 0; min-height: 0; background: #fff; }
#canvas { width: 100%; height: 100%; display: block; cursor: default; touch-action: none; user-select: none; }
#canvas.grab { cursor: grab; }
#canvas.panning, #canvas.grab.panning { cursor: grabbing; }
#canvas.picking { cursor: crosshair; }
#canvas .person, #canvas .tlabel, #canvas .system { cursor: move; }
#canvas .union, #canvas .relation, #canvas .tie, #canvas .household .hit { cursor: pointer; }
.empty {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  color: var(--ink-soft); text-align: center; line-height: 1.9;
}
.empty .box { background: rgba(255,255,255,.92); border: 1px dashed var(--border); border-radius: 12px; padding: 22px 30px; }
.empty b { color: var(--brand); }
.zoombar {
  position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center;
  background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 2px 8px rgba(23,63,82,.08);
}
.zoombar button { padding: 4px 9px; }
.editbar { left: 12px; right: auto; top: 12px; bottom: auto; }
.zoombar .zv { min-width: 48px; text-align: center; font-size: 12px; color: var(--ink-soft); }
.banner {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); font-weight: 700;
  border-radius: 8px; padding: 7px 14px; box-shadow: 0 2px 10px rgba(178,106,0,.15); display: flex; gap: 10px; align-items: center;
}
.banner button { padding: 3px 8px; }

/* ── 狀態列 ── */
.statusbar {
  display: flex; gap: 14px; align-items: center; padding: 5px 14px; font-size: 12px;
  color: var(--ink-soft); background: #fff; border-top: 1px solid var(--border);
}
.statusbar .ver { margin-left: auto; color: var(--muted); }
.statusbar .lock { color: var(--ok); }

/* ── 提示訊息 ── */
#toasts { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; pointer-events: none; }
.toast {
  pointer-events: auto; background: var(--ink); color: #fff; border-radius: 8px; padding: 9px 16px; max-width: 560px;
  box-shadow: 0 4px 16px rgba(23,63,82,.25); font-size: 13px; line-height: 1.5; border-left: 5px solid var(--cyan);
}
.toast.ok { border-left-color: #5FE0A6; }
.toast.warn { border-left-color: #FFC46B; }
.toast.error { background: #3A1518; border-left-color: #FF8A8A; }

/* ── 對話框（品牌橫幅＋白卡＋右下按鈕）── */
dialog { border: none; border-radius: 10px; padding: 0; width: min(560px, 92vw); color: var(--ink); box-shadow: 0 12px 40px rgba(23,63,82,.3); }
dialog::backdrop { background: rgba(15,39,51,.45); }
dialog .dh { background: var(--brand); color: #fff; padding: 12px 18px; font-weight: 700; font-size: 15px; }
dialog .db { padding: 16px 18px; max-height: 64vh; overflow-y: auto; line-height: 1.7; }
dialog .db p { margin: 0 0 8px; }
dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; }
.fieldrow { display: grid; grid-template-columns: 22px 1fr 54px auto; gap: 6px; align-items: center; margin: 6px 0; }
.fieldrow .n { font-size: 12px; color: var(--ink-soft); text-align: right; }
.fieldrow .ops { display: flex; gap: 3px; }
.fieldrow .ops button { padding: 3px 6px; }
dialog.wide { width: min(780px, 94vw); }
.help h4 { margin: 14px 0 6px; color: var(--brand-deep); }
.help p { margin: 0 0 8px; }
.help ol { margin: 0 0 8px; padding-left: 22px; }
.help .tip { background: var(--warn-bg); border-left: 4px solid var(--warn); border-radius: 4px; padding: 6px 10px; margin: 8px 0; }
.legend .desc { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-top: 1px; }
.help ul { margin: 0 0 8px; padding-left: 20px; }
.help kbd { background: var(--field); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
.legend { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; align-items: center; font-size: 13px; }

/* ── 可收合區塊（一次只展開一類）── */
details.acc { border: 1px solid var(--border); border-radius: 6px; margin: 6px 0 0; background: #fff; }
details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; border-radius: 6px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: '▸'; color: var(--brand); font-size: 12px; transition: transform .15s; }
details.acc[open] > summary::before { transform: rotate(90deg); }
details.acc > summary:hover { background: #F4FBFF; }
details.acc > summary .t { font-weight: 700; white-space: nowrap; }
details.acc > summary .v { margin-left: auto; color: var(--brand-deep); font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.acc > summary .v.none { color: var(--muted); }
details.acc[open] > summary { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; background: #F4FBFF; }
details.acc .accb { padding: 2px 10px 10px; }
label.field .hint { float: right; color: var(--muted); font-size: 11px; }
.symprev svg { display: block; }
.conds { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; }
.cond { display: flex; align-items: center; gap: 5px; font-size: 12.5px; cursor: pointer; padding: 2px 0; }
.cond input { accent-color: var(--brand); margin: 0; width: 14px; height: 14px; }
.cond i { width: 12px; height: 12px; border-radius: 2px; flex: none; border: 1px solid rgba(0,0,0,.18); }

/* ── 分類式選擇器：上排大類、下面線條（附縮圖）── */
.picker .cats { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.picker .cats button { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
.picker .cats button.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.picker .items { display: flex; flex-direction: column; gap: 3px; }
.picker .items button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 3px 8px; font-size: 13px; }
.picker .items button svg { flex: none; }
.picker .items button.on { border-color: var(--brand); background: #E6F4FB; font-weight: 700; box-shadow: inset 3px 0 0 var(--brand); }
dialog .picker .items { display: grid; grid-template-columns: 1fr 1fr; }
.curtype { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 2px 0; }
.typebtn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; margin-top: 3px; padding: 4px 8px; }
.typebtn span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.typebtn .chev { margin-left: auto; color: var(--ink-soft); }
.legend { margin-bottom: 4px; }
h4.lh { margin: 12px 0 6px; color: var(--brand-deep); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 200px minmax(0, 1fr) 272px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5E7E"/><stop offset="1" stop-color="#38BDF8"/></linearGradient></defs>
      <rect x="1" y="1" width="32" height="32" rx="8" fill="url(#lg)" stroke="#fff" stroke-opacity=".5"/>
      <rect x="6" y="6" width="8" height="8" fill="none" stroke="#fff" stroke-width="1.8"/>
      <circle cx="24" cy="10" r="4.2" fill="none" stroke="#fff" stroke-width="1.8"/>
      <path d="M10 14v4h14v-4M17 18v4M11 22h12M11 22v3M23 22v3" fill="none" stroke="#fff" stroke-width="1.6"/>
      <circle cx="23" cy="27.5" r="2.5" fill="#fff"/><rect x="8.6" y="25" width="5" height="5" fill="#fff"/>
    </svg>
    <h1>家系圖工具</h1>
    <span class="file" id="fileLabel">未命名</span>
  </div>
  <nav class="filebar">
    <button id="btnNew" title="開一張新的空白家系圖">新增</button>
    <button id="btnOpen" title="開啟之前存的家系圖檔（.json）（Ctrl+O）">開啟…</button>
    <button id="btnSave" class="primary" title="儲存（Ctrl+S）">儲存</button>
    <button id="btnSaveAs" title="另存新檔（Ctrl+Shift+S）">另存新檔…</button>
    <span class="sep"></span>
    <button id="btnCopy" title="複製成圖片，直接到 Word 貼上">複製圖片</button>
    <button id="btnPng" title="存成高解析 PNG 圖檔">匯出 PNG</button>
    <button id="btnSvg" title="存成向量 SVG 圖檔（放大不失真）">匯出 SVG</button>
    <span class="sep"></span>
    <button id="btnHelp" title="使用說明與圖例說明（F1）">使用說明</button>
  </nav>
</header>

<main class="layout">
  <aside class="tools" id="tools">
    <section class="card">
      <h3><span class="badge">1</span>新增人物</h3>
      <div class="grid3">
        <button class="addbtn" data-add="M" title="新增男性"><svg viewBox="0 0 26 26"><rect x="3" y="3" width="20" height="20" fill="#fff" stroke="#173F52" stroke-width="2"/></svg>男</button>
        <button class="addbtn" data-add="F" title="新增女性"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="#fff" stroke="#173F52" stroke-width="2"/></svg>女</button>
        <button class="addbtn" data-add="U" title="新增未知性別"><svg viewBox="0 0 26 26"><text x="13" y="22" text-anchor="middle" font-size="24" font-weight="700" fill="#173F52">?</text></svg>未知</button>
      </div>
    </section>

    <section class="card">
      <h3><span class="badge">2</span>家庭關係</h3>
      <div class="grid2">
        <button data-kin="partner">＋伴侶</button>
        <button data-kin="parents">＋父母</button>
        <button data-kin="son">＋兒子</button>
        <button data-kin="daughter">＋女兒</button>
        <button data-kin="brother">＋兄弟</button>
        <button data-kin="sister">＋姊妹</button>
      </div>
      <div class="stack" style="margin-top:6px">
        <button data-kin="linkPartner" class="secondary">連結為伴侶…</button>
        <button data-kin="attachChild">設為某段關係的子女…</button>
      </div>
      <p class="hint-text" id="kinHint">先在畫布上點選一個人。</p>
    </section>

    <section class="card">
      <h3><span class="badge">3</span>情感關係</h3>
      <div class="soft">新拉的線用這個類型：</div>
      <button id="relTypeBtn" class="typebtn" title="選擇類型：先選大類，再選線條"></button>
      <div class="stack" style="margin-top:6px">
        <button id="btnRelation" class="secondary">從選取的人拉線…</button>
        <button id="btnLegend" class="link">看圖例說明（符號與線條）</button>
      </div>
    </section>

    <section class="card">
      <h3><span class="badge">4</span>標註</h3>
      <div class="stack">
        <button id="btnHousehold" title="先選取同住的人（按住 Shift 可多選）">圈成生活圈（同住）</button>
        <button id="btnLabel">新增文字說明</button>
      </div>
    </section>

    <section class="card">
      <h3><span class="badge">5</span>生態圖</h3>
      <div class="soft">顯示：</div>
      <div id="viewModes"></div>
      <div class="stack" style="margin-top:6px">
        <button id="btnSystem" class="secondary">＋新增資源…</button>
        <button id="btnTie">拉生態連結…</button>
      </div>
      <p class="hint-text" id="tieHint">先點選一個人或資源，再按「拉生態連結」。</p>
    </section>

    <section class="card">
      <h3><span class="badge">6</span>顯示設定</h3>
      <div class="soft">圖上顯示哪些資料：</div>
      <div id="showFields"></div>
      <label class="check"><input type="checkbox" id="optYears">生卒年</label>
      <div class="soft" style="margin-top:8px">標籤格式：</div>
      <label class="check"><input type="radio" name="labelMode" value="value">只顯示內容（例：工人）</label>
      <label class="check"><input type="radio" name="labelMode" value="labelled">欄位名＋內容（例：職業：工人）</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="optColor">情感關係線用彩色</label>
      <label class="check"><input type="checkbox" id="optLineLabels">線旁說明（特殊線條標名稱）</label>
      <button id="btnFields" style="margin-top:8px;width:100%">管理欄位（新增／改名／刪除）…</button>
    </section>
  </aside>

  <section class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="#EEF4F8" stroke-width="1"/>
        </pattern>
      </defs>
      <g id="viewport"><rect id="gridRect" x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid)"/><g id="world"></g><g id="overlay"></g></g>
    </svg>
    <div class="empty" id="empty"><div class="box">
      按左邊「<b>男</b>」「<b>女</b>」開始畫，<br>
      或按上方「<b>開啟…</b>」打開之前存的家系圖檔。<br>
      <span class="muted">點選人物後，右邊可以填年齡、職業、經濟等資料，會自動顯示在圖上。</span>
    </div></div>
    <div class="zoombar editbar">

        colorRelations: true,   // 情感關係線彩色（關掉＝黑白列印友善）
        view: 'both',           // 顯示模式（VIEW_MODES）：只看家系圖／家系圖＋生態圖／生態圖
        lineLabels: true,       // 線旁說明：特殊線條標名稱＋顯示使用者寫的說明
      },
      persons: {}, unions: {}, relations: {}, households: {}, labels: {},
      systems: {}, ties: {},    // 生態圖：外部系統（資源）與生態連結
      seq: 0,
    };
  }

  // 預設檔名：個案編號_家系生態圖_建立日期（使用者 2026-09-21 決定）。
  // 隱私規則「預設檔名不放姓名」：只用個案編號，案主姓名與標題都不進檔名
  function defaultFileName(doc, ext) {
    const m = doc.meta || {};
    const parts = [String(m.caseNo || '').trim(), '家系生態圖', m.created || m.assessDate || todayISO()].filter(Boolean);
    return parts.join('_').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 80) + (ext || '');
  }

  function newId(doc, prefix) {
    doc.seq = (doc.seq || 0) + 1;
    return prefix + doc.seq;
  }

  // ── 日期與年齡 ──
  // 接受：1965、1965-03、1965-03-08、1965/3/8、民國54年3月8日、民54、54/3/8（年份 < 1000 視為民國）
  function parseDate(input) {
    if (input == null) return null;
    let s = String(input).trim();
    if (!s) return null;
    let roc = false;
    if (/^民國?/.test(s)) { roc = true; s = s.replace(/^民國?/, ''); }
    s = s.replace(/[年月]/g, '-').replace(/日/g, '').replace(/[./]/g, '-').replace(/-+$/, '');
    const m = s.match(/^(\d{1,4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/);
    if (!m) return null;
    let y = +m[1];
    const mo = m[2] ? +m[2] : null;
    const d = m[3] ? +m[3] : null;
    if (roc || y < 1000) y += 1911;
    if (mo !== null && (mo < 1 || mo > 12)) return null;
    if (d !== null && (d < 1 || d > 31)) return null;
    return { y, m: mo, d };
  }

  function formatDate(pd) {
    if (!pd) return '';
    const p = (n) => String(n).padStart(2, '0');
    if (pd.m == null) return String(pd.y);
    if (pd.d == null) return `${pd.y}-${p(pd.m)}`;
    return `${pd.y}-${p(pd.m)}-${p(pd.d)}`;
  }

  // 完整歲數；只有年份時＝年份相減（標記 approx）
  function yearsBetween(a, b) {
    let n = b.y - a.y;
    const approx = a.m == null || b.m == null;
    if (!approx) {
      const ad = a.d == null ? 1 : a.d;
      const bd = b.d == null ? 1 : b.d;
      if (b.m < a.m || (b.m === a.m && bd < ad)) n -= 1;
    }
    return { n, approx: approx || a.d == null || b.d == null };
  }

  const toAge = (v) => {
    if (v === '' || v == null) return null;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 && n < 150 ? Math.floor(n) : null;
  };

  /* 年齡以「評估日期」為基準，不是今天：
     兩年後重開舊檔，圖上的年齡仍要跟當時的個案紀錄一致。 */
  function ageOf(doc, p) {
    const ref = parseDate(doc.meta && doc.meta.assessDate) || parseDate(todayISO());
    const birth = parseDate(p.birth);
    if (p.deceased) {
      const da = toAge(p.deathAge);
      if (da !== null) return { value: da, source: 'manual' };
      const death = parseDate(p.death);
      if (birth && death) {
        const r = yearsBetween(birth, death);
        if (r.n >= 0) return { value: r.n, source: 'birth', approx: r.approx };
      }
      const ma = toAge(p.age);
      return ma !== null ? { value: ma, source: 'manual' } : { value: null, source: null };
    }
    if (birth) {
      const r = yearsBetween(birth, ref);
      if (r.n >= 0) return { value: r.n, source: 'birth', approx: r.approx };
    }
    const ma = toAge(p.age);
    return ma !== null ? { value: ma, source: 'manual' } : { value: null, source: null };
  }

  // ── 圖上文字 ──
  // 字寬估算（決定換行與外框大小；不依賴瀏覽器量字，測試才能重現）
  function charEm(ch) {
    const c = ch.codePointAt(0);
    if (c >= 0x2E80 && c <= 0x9FFF) return 1;       // 中日韓文字與符號
    if (c >= 0xAC00 && c <= 0xD7AF) return 1;       // 韓文
    if (c >= 0xFF00 && c <= 0xFFEF) return 1;       // 全形
    return ch === ' ' ? 0.3 : 0.58;
  }
  const textEm = (s) => Array.from(String(s)).reduce((a, ch) => a + charEm(ch), 0);

  function wrapText(s, maxEm) {
    const out = [];
    for (const para of String(s).split(/\r?\n/)) {
      let line = '', w = 0;
      for (const ch of Array.from(para)) {
        const cw = charEm(ch);
        if (w + cw > maxEm && line) { out.push(line); line = ''; w = 0; }
        line += ch; w += cw;
      }
      out.push(line);
    }
    return out;
  }

  const LABEL_WRAP_EM = 8;  // 人物下方標籤每行最多約 8 個中文字寬

  // 人物下方要顯示的文字（每個元素＝一行；kind='name' 給畫圖層套粗體）
  function labelLines(doc, p) {
    const lines = [];
    const push = (text, kind) => wrapText(text, LABEL_WRAP_EM).forEach(t => { if (t) lines.push({ text: t, kind }); });
    if (p.name && p.name.trim()) push(p.name.trim(), 'name');
    const st = doc.settings;
    if (st.showYears) {
      const b = parseDate(p.birth), d = parseDate(p.death);
      if (b || (p.deceased && d)) push(`${b ? b.y : '?'}–${p.deceased ? (d ? d.y : '?') : ''}`, 'attr');
    }
    for (const f of st.fields) {
      if (!f.show) continue;
      const v = (p.attrs && p.attrs[f.key] != null) ? String(p.attrs[f.key]).trim() : '';
      if (!v) continue;
      push(st.labelMode === 'labelled' ? `${f.label}：${v}` : v, 'attr');
    }
    return lines;
  }

  // 欄位輸入提示：預設提示 ∪ 本檔已出現過的值（模式 9）
  function suggestionsFor(doc, key) {
    const base = (DEFAULT_FIELDS.find(f => f.key === key) || { suggest: [] }).suggest;
    const used = Object.values(doc.persons).map(p => (p.attrs || {})[key]).filter(v => v && String(v).trim());
    return Array.from(new Set([...base, ...used.map(v => String(v).trim())]));
  }

  // ── 欄位管理 ──
  function addField(doc, label) {
    const name = String(label || '').trim().slice(0, 20);
    if (!name || doc.settings.fields.some(f => f.label === name)) return null;
    let key;
    do { key = newId(doc, 'f'); } while (doc.settings.fields.some(f => f.key === key));
    doc.settings.fields.push({ key, label: name, show: true });
    return key;
  }
  function renameField(doc, key, label) {
    const f = doc.settings.fields.find(x => x.key === key);
    const name = String(label || '').trim().slice(0, 20);
    if (!f || !name || doc.settings.fields.some(x => x.key !== key && x.label === name)) return false;
    f.label = name;          // 只改顯示名，資料鍵不動
    return true;
  }
  function fieldUsage(doc, key) {
    return Object.values(doc.persons).filter(p => p.attrs && String(p.attrs[key] || '').trim()).length;
  }
  function removeField(doc, key) {
    const i = doc.settings.fields.findIndex(f => f.key === key);
    if (i < 0) return false;
    doc.settings.fields.splice(i, 1);
    for (const p of Object.values(doc.persons)) if (p.attrs) delete p.attrs[key];
    return true;
  }
  function moveField(doc, key, delta) {
    const a = doc.settings.fields, i = a.findIndex(f => f.key === key), j = i + delta;
    if (i < 0 || j < 0 || j >= a.length) return false;
    [a[i], a[j]] = [a[j], a[i]];
    return true;
  }

  // ── 查詢 ──
  const unionsOf = (doc, pid) => Object.values(doc.unions).filter(u => u.partners.includes(pid));
  const parentUnionOf = (doc, pid) => Object.values(doc.unions).find(u => u.children.some(c => c.id === pid)) || null;
  function unionBetween(doc, a, b) {
    return Object.values(doc.unions).find(u => u.partners.length === 2 && u.partners.includes(a) && u.partners.includes(b)) || null;
  }
  function occupied(doc, x, y) {
    return Object.values(doc.persons).some(p => Math.abs(p.x - x) < S * 1.5 && Math.abs(p.y - y) < S * 1.5);
  }
  function freeSpot(doc, x, y, dir) {
    let nx = snap(x);
    for (let i = 0; i < 60 && occupied(doc, nx, snap(y)); i++) nx += (dir || 1) * GAP_X / 2;
    return nx;
  }

  // ── 編輯指令（呼叫前由介面層先存復原點）──
  function blankPerson(id, gender, x, y) {
    return { id, gender, x: snap(x), y: snap(y), name: '', index: false, deceased: false,
             age: '', birth: '', death: '', deathAge: '', attrs: {},
             life: '', culture: '', illness: '', substance: '', conditions: [] };
  }

  function addPerson(doc, opts) {
    const o = opts || {};
    const x = o.x || 0, y = o.y || 0;
    const id = newId(doc, 'p');
    const p = blankPerson(id, has(GENDERS, o.gender) ? o.gender : 'U', freeSpot(doc, x, y), y);
    p.name = String(o.name || '').slice(0, 60);
    doc.persons[id] = p;
    return id;
  }

  function linkPartners(doc, a, b, type) {
    if (a === b || !doc.persons[a] || !doc.persons[b]) return null;
    const ex = unionBetween(doc, a, b);
    if (ex) return ex.id;
    const id = newId(doc, 'u');
    const [l, r] = doc.persons[a].x <= doc.persons[b].x ? [a, b] : [b, a];
    doc.unions[id] = { id, partners: [l, r], type: has(FAMILY_TYPES, type) ? type : 'Marriage', children: [], twins: [], note: '' };
    return id;
  }

  function addPartner(doc, pid) {
    const p = doc.persons[pid];
    if (!p) return null;
    const g = p.gender === 'M' ? 'F' : p.gender === 'F' ? 'M' : 'U';
    // 右邊已經有伴侶 → 新伴侶放左邊（「前任—本人—現任」的標準排法，兩條伴侶線才不會疊在一起）
    const others = unionsOf(doc, pid).map(u => u.partners.find(x => x !== pid)).filter(x => x && doc.persons[x]);
    const rightTaken = others.some(x => doc.persons[x].x > p.x), leftTaken = others.some(x => doc.persons[x].x < p.x);
    let dir = rightTaken && !leftTaken ? -1 : 1;
    // 旁邊的位置被別人（例如手足）佔住、另一側是空的 → 放另一側，伴侶線才不會從別人底下穿過
    const slot = (d) => snap(p.x + d * GAP_X);
    const otherSideFree = dir === 1 ? !leftTaken : !rightTaken;
    if (occupied(doc, slot(dir), p.y) && !occupied(doc, slot(-dir), p.y) && otherSideFree) dir = -dir;
    const nid = newId(doc, 'p');
    doc.persons[nid] = blankPerson(nid, g, freeSpot(doc, p.x + dir * GAP_X, p.y, dir), p.y);
    return { personId: nid, unionId: linkPartners(doc, pid, nid) };
  }

  function addChild(doc, unionId, gender) {
    const u = doc.unions[unionId];
    if (!u) return null;
    const ps = u.partners.map(id => doc.persons[id]).filter(Boolean);
    if (!ps.length) return null;
    const baseY = Math.max(...ps.map(p => p.y)) + GAP_Y;
    const kids = u.children.map(c => doc.persons[c.id]).filter(Boolean);
    const midX = ps.reduce((a, p) => a + p.x, 0) / ps.length;
    const x = kids.length ? Math.max(...kids.map(k => k.x)) + GAP_X * 0.8 : midX;
    const id = newId(doc, 'p');
    doc.persons[id] = blankPerson(id, has(GENDERS, gender) ? gender : 'U', freeSpot(doc, x, baseY, 1), baseY);
    u.children.push({ id, link: 'bio' });
    return id;
  }

  // 對「人」加子女：只有一段關係＝加在那段；沒有＝建單親家庭；多段＝回傳 needUnion 讓介面請使用者先點關係線
  function addChildToPerson(doc, pid, gender) {
    if (!doc.persons[pid]) return null;
    const us = unionsOf(doc, pid);
    if (us.length > 1) return { needUnion: true };
    let uid = us.length ? us[0].id : null;
    if (!uid) {
      uid = newId(doc, 'u');
      doc.unions[uid] = { id: uid, partners: [pid], type: 'Other', children: [], twins: [], note: '' };
    }
    return { personId: addChild(doc, uid, gender), unionId: uid };
  }

  function addParents(doc, pid) {
    const c = doc.persons[pid];
    if (!c) return null;
    if (parentUnionOf(doc, pid)) return { exists: true };
    const y = c.y - GAP_Y;
    const fid = newId(doc, 'p');
    doc.persons[fid] = blankPerson(fid, 'M', freeSpot(doc, c.x - GAP_X / 2, y, -1), y);
    const mid = newId(doc, 'p');
    doc.persons[mid] = blankPerson(mid, 'F', freeSpot(doc, doc.persons[fid].x + GAP_X, y, 1), y);
    const uid = linkPartners(doc, fid, mid);
    doc.unions[uid].children.push({ id: pid, link: 'bio' });
    return { fatherId: fid, motherId: mid, unionId: uid };
  }

  function addSibling(doc, pid, gender) {
    const u = parentUnionOf(doc, pid);
    if (!u) return { needParents: true };
    return { personId: addChild(doc, u.id, gender), unionId: u.id };
  }

  // 把某人加為某段關係的子女（例：先各自畫好再連起來）
  function attachChild(doc, unionId, pid) {
    const u = doc.unions[unionId];
    if (!u || !doc.persons[pid] || u.partners.includes(pid)) return false;
    const cur = parentUnionOf(doc, pid);
    if (cur) { cur.children = cur.children.filter(c => c.id !== pid); pruneTwins(cur); }
    u.children.push({ id: pid, link: 'bio' });
    return true;
  }

  // ── 雙胞胎：同一段關係底下的子女才能設為雙胞胎；一個人只屬於一組；少於 2 人的組自動拿掉 ──
  function pruneTwins(u) {
    const kids = new Set(u.children.map(c => c.id));
    u.twins = (u.twins || []).map(t => ({ ids: t.ids.filter(id => kids.has(id)), kind: t.kind }))
                             .filter(t => t.ids.length >= 2);
  }
  // 選到的人是不是同一段關係的子女（設雙胞胎前檢查用）；是的話回傳那段關係
  function commonParentUnion(doc, ids) {
    const us = ids.map(id => parentUnionOf(doc, id));
    return us.length >= 2 && us[0] && us.every(u => u === us[0]) ? us[0] : null;
  }
  function setTwins(doc, unionId, ids, kind) {
    const u = doc.unions[unionId];
    if (!u) return false;
    const kids = new Set(u.children.map(c => c.id));
    const group = Array.from(new Set(ids)).filter(id => kids.has(id));
    if (group.length < 2) return false;
    u.twins = (u.twins || []).map(t => ({ ids: t.ids.filter(id => !group.includes(id)), kind: t.kind }));
    u.twins.push({ ids: group, kind: has(TWIN_KINDS, kind) ? kind : 'Fraternal' });
    pruneTwins(u);
    return true;
  }
  function twinGroupOf(doc, pid) {
    for (const u of Object.values(doc.unions)) {
      const g = (u.twins || []).find(t => t.ids.includes(pid));
      if (g) return { union: u, group: g };
    }
    return null;
  }
  function clearTwin(doc, pid) {
    const hit = twinGroupOf(doc, pid);
    if (!hit) return false;
    hit.union.twins = hit.union.twins.map(t => ({ ids: t.ids.filter(id => id !== pid), kind: t.kind }));
    pruneTwins(hit.union);
    return true;
  }

  function addRelation(doc, a, b, type) {
    if (a === b || !doc.persons[a] || !doc.persons[b]) return null;
    const id = newId(doc, 'r');
    doc.relations[id] = { id, a, b, type: has(EMOTION_TYPES, type) ? type : 'Plain', note: '' };
    return id;
  }

  function addHousehold(doc, members, label) {
    const ms = Array.from(new Set(members)).filter(id => doc.persons[id]);
    if (!ms.length) return null;
    const id = newId(doc, 'h');
    doc.households[id] = { id, members: ms, label: String(label || '').slice(0, 30) };
    return id;
  }

  function addLabel(doc, x, y, text) {
    const id = newId(doc, 't');
    doc.labels[id] = { id, x: snap(x), y: snap(y), text: String(text == null ? '文字說明' : text).slice(0, 1000) };
    return id;
  }

  // 生態圖：外部系統（畫成圓，名稱寫在圓裡）
  function addSystem(doc, o) {
    const id = newId(doc, 's');
    doc.systems[id] = { id, name: str(o && o.name, 30), x: snap((o && o.x) || 0), y: snap((o && o.y) || 0) };
    return id;
  }
  // 生態連結：兩端可以是人、外部系統、或生活圈（＝整個家庭）；同一端不能連自己
  const tieEndExists = (doc, id) => !!(doc.persons[id] || doc.systems[id] || doc.households[id]);
  function addTie(doc, a, b, o) {
    if (a === b || !tieEndExists(doc, a) || !tieEndExists(doc, b)) return null;
    const id = newId(doc, 'e');
    const q = o || {};
    doc.ties[id] = { id, a, b,
      strength: has(TIE_STRENGTHS, q.strength) ? q.strength : 'normal',
      stress: !!q.stress,
      dir: has(TIE_DIRS, q.dir) ? q.dir : '',
      note: str(q.note, 60) };
    return id;
  }
  const tieBetween = (doc, a, b) => Object.values(doc.ties).find(t => (t.a === a && t.b === b) || (t.a === b && t.b === a)) || null;

  function moveItems(doc, ids, dx, dy) {
    for (const id of ids) {
      const o = doc.persons[id] || doc.labels[id] || doc.systems[id];
      if (o) { o.x += dx; o.y += dy; }
    }
  }
  function snapItems(doc, ids) {
    for (const id of ids) {
      const o = doc.persons[id] || doc.labels[id] || doc.systems[id];
      if (o) { o.x = snap(o.x); o.y = snap(o.y); }
    }
  }

  // 刪除：人→從所有關係移除；沒有伴侶、或只剩一位伴侶且沒有子女的關係一併刪；情感關係與生活圈同步清理
  function deleteItems(doc, ids) {
    for (const id of new Set(ids)) {
      delete doc.persons[id]; delete doc.unions[id]; delete doc.relations[id];
      delete doc.households[id]; delete doc.labels[id];
      delete doc.systems[id]; delete doc.ties[id];
    }
    for (const u of Object.values(doc.unions)) {
      u.partners = u.partners.filter(p => doc.persons[p]);
      u.children = u.children.filter(c => doc.persons[c.id]);
      pruneTwins(u);
      if (!u.partners.length || (u.partners.length === 1 && !u.children.length)) delete doc.unions[u.id];
    }
    for (const r of Object.values(doc.relations)) if (!doc.persons[r.a] || !doc.persons[r.b]) delete doc.relations[r.id];
    for (const h of Object.values(doc.households)) {
      h.members = h.members.filter(m => doc.persons[m]);
      if (!h.members.length) delete doc.households[h.id];
    }
    // 生態連結：任一端不見了就一起刪（人、資源、生活圈都算）
    for (const t of Object.values(doc.ties)) if (!tieEndExists(doc, t.a) || !tieEndExists(doc, t.b)) delete doc.ties[t.id];
  }

  // ── 復原／重做（快照式：每次變更前存整份 JSON；家系圖檔很小，這樣最不容易出錯）──
  class History {
    constructor(max) { this.max = max || 100; this.undoStack = []; this.redoStack = []; }
    push(doc) {
      this.undoStack.push(JSON.stringify(doc));
      if (this.undoStack.length > this.max) this.undoStack.shift();
      this.redoStack = [];
    }
    undo(doc) {
      if (!this.undoStack.length) return null;
      this.redoStack.push(JSON.stringify(doc));
      return JSON.parse(this.undoStack.pop());
    }
    redo(doc) {
      if (!this.redoStack.length) return null;
      this.undoStack.push(JSON.stringify(doc));
      return JSON.parse(this.redoStack.pop());
    }
    clear() { this.undoStack = []; this.redoStack = []; }
    get canUndo() { return this.undoStack.length > 0; }
    get canRedo() { return this.redoStack.length > 0; }
  }

  // ── 邊界正規化（模式 8：外部來的檔案一律在這裡驗證並重建，只留認得的欄位）──
  const str = (v, max) => (v == null ? '' : String(v)).slice(0, max);
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? Math.max(-1e6, Math.min(1e6, n)) : 0; };
  // id 會拿來當物件鍵：__proto__ 等字串也符合字元規則，必須另外排除（驗收發現：否則會換掉集合的原型）
  const okId = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v) && !BAD_KEYS.has(v);
  const okKey = (k) => typeof k === 'string' && k.length > 0 && k.length <= 40 && !BAD_KEYS.has(k);
  const values = (o) => (o && typeof o === 'object' && !Array.isArray(o))
    ? Object.keys(o).filter(k => !BAD_KEYS.has(k)).map(k => o[k]) : [];

  class FormatError extends Error {}

  function normalizeDoc(raw) {
    if (!raw || typeof raw !== 'object' || raw.format !== FORMAT) throw new FormatError('not a genogram-tool document');
    if (typeof raw.version !== 'number' || raw.version > VERSION) throw new FormatError('unsupported version');
    const warn = [];
    const doc = newDoc();
    const m = raw.meta || {};
    doc.meta.title = str(m.title, 100);
    if (parseDate(m.assessDate)) doc.meta.assessDate = str(m.assessDate, 20);
    doc.meta.caseNo = str(m.caseNo, 40).trim();
    doc.meta.created = parseDate(m.created) ? str(m.created, 20) : '';   // 舊檔沒有建立日期就留空，不自己編

    const s = raw.settings || {};
    if (Array.isArray(s.fields)) {
      const seen = new Set();
      doc.settings.fields = s.fields
        .filter(f => f && okKey(f.key) && !seen.has(f.key) && seen.add(f.key))
        .map(f => ({ key: f.key, label: str(f.label, 20) || f.key, show: !!f.show }));
    }
    doc.settings.labelMode = s.labelMode === 'labelled' ? 'labelled' : 'value';
    doc.settings.showYears = !!s.showYears;
    doc.settings.colorRelations = s.colorRelations !== false;
    doc.settings.view = has(VIEW_MODES, s.view) ? s.view : 'both';
    doc.settings.lineLabels = s.lineLabels !== false;

    // id 在整份文件裡必須唯一：同一個 id 既是人又是資源的話，連結會靜默解析成其中一個（審查 2026-09-20）
    const taken = new Set();
    const freeId = (id) => { if (!okId(id) || taken.has(id)) return false; taken.add(id); return true; };
    const v1 = raw.version < 2;
    const own = (map, k) => (typeof k === 'string' && Object.prototype.hasOwnProperty.call(map, k) ? map[k] : undefined);
    for (const p of values(raw.persons)) {
      if (!p || !freeId(p.id)) { warn.push('person'); continue; }
      const q = blankPerson(p.id, has(GENDERS, p.gender) ? p.gender : 'U', 0, 0);
      q.x = num(p.x); q.y = num(p.y);
      q.name = str(p.name, 60); q.index = !!p.index; q.deceased = !!p.deceased;
      q.age = str(p.age, 5); q.birth = str(p.birth, 20); q.death = str(p.death, 20); q.deathAge = str(p.deathAge, 5);
      // v2 新欄位（v1 檔沒有 → 預設值；不認得的值一律回到預設）
      q.life = has(LIFE_STATES, p.life) ? p.life : '';
      q.culture = has(CULTURES, p.culture) ? p.culture : '';
      q.illness = has(ILLNESS, p.illness) ? p.illness : '';
      q.substance = has(SUBSTANCE, p.substance) ? p.substance : '';
      q.conditions = Array.isArray(p.conditions) ? Array.from(new Set(p.conditions.filter(k => has(CONDITIONS, k)))) : [];
      if (p.attrs && typeof p.attrs === 'object') {
        for (const k of Object.keys(p.attrs)) {
          if (!okKey(k)) continue;
          const v = str(p.attrs[k], 500);
          if (!v) continue;
          q.attrs[k] = v;
          // 資料裡有、欄位表沒有的欄位：補進欄位表（不丟資料），預設不顯示
          if (!doc.settings.fields.some(f => f.key === k)) doc.settings.fields.push({ key: k, label: k, show: false });
        }
      }
      doc.persons[q.id] = q;
    }
    const P = doc.persons;
    for (const u of values(raw.unions)) {
      if (!u || !freeId(u.id) || !Array.isArray(u.partners)) { warn.push('union'); continue; }
      const partners = Array.from(new Set(u.partners.filter(id => P[id]))).slice(0, 2);
      const seenKid = new Set();
      const children = (Array.isArray(u.children) ? u.children : [])
        .filter(c => c && P[c.id] && !partners.includes(c.id) && !seenKid.has(c.id) && seenKid.add(c.id))
        .map(c => ({ id: c.id, link: has(CHILD_LINKS, c.link) ? c.link : 'bio' }));
      if (!partners.length) { warn.push('union'); continue; }
      let type;
      if (v1) {   // v1：類型＋狀態兩欄；有 GenoPro 原值（gp）就直接用原值，最準
        const end = ['', 'separated', 'divorced'].includes(u.end) ? u.end : '';
        type = has(FAMILY_TYPES, u.gp) ? u.gp : (own(V1_UNION, u.type) || V1_UNION.married)[end];
      } else type = has(FAMILY_TYPES, u.type) ? u.type : 'Other';
      // 雙胞胎：成員必須是這段關係的子女、同一人只能在一組、每組至少 2 人
      const kids = new Set(children.map(c => c.id)), used = new Set(), twins = [];
      for (const t of (v1 || !Array.isArray(u.twins) ? [] : u.twins)) {
        const ids = Array.isArray(t && t.ids) ? Array.from(new Set(t.ids.filter(id => kids.has(id) && !used.has(id)))) : [];
        if (ids.length < 2) continue;
        ids.forEach(id => used.add(id));
        twins.push({ ids, kind: has(TWIN_KINDS, t.kind) ? t.kind : 'Fraternal' });
      }
      doc.unions[u.id] = { id: u.id, partners, children, type, twins, note: str(u.note, 60) };
    }
    for (const r of values(raw.relations)) {
      if (!r || !freeId(r.id) || !P[r.a] || !P[r.b] || r.a === r.b) { warn.push('relation'); continue; }
      let type, note = str(r.note, 300);
      if (v1) {
        type = has(EMOTION_TYPES, r.gp) ? r.gp : (own(V1_RELATION, r.type) || 'Other');
        // 「關係惡化」是 Word 範本才有的類型，參考圖沒有 → 轉成不和／衝突，原類型寫進備註，不讓意思消失
        if (r.type === 'deteriorating' && !has(EMOTION_TYPES, r.gp)) note = ('原類型：關係惡化' + (note ? '；' + note : '')).slice(0, 300);
      } else type = has(EMOTION_TYPES, r.type) ? r.type : 'Other';
      doc.relations[r.id] = { id: r.id, a: r.a, b: r.b, type, note };
    }
    for (const h of values(raw.households)) {
      if (!h || !freeId(h.id) || !Array.isArray(h.members)) { warn.push('household'); continue; }
      const members = Array.from(new Set(h.members.filter(id => P[id])));
      if (!members.length) { warn.push('household'); continue; }
      doc.households[h.id] = { id: h.id, members, label: str(h.label, 30) };
    }
    for (const t of values(raw.labels)) {
      if (!t || !freeId(t.id)) { warn.push('label'); continue; }
      doc.labels[t.id] = { id: t.id, x: num(t.x), y: num(t.y), text: str(t.text, 1000) };
    }
    // v3：外部系統與生態連結（v2 以前的檔沒有這兩塊 → 空的）
    for (const y of values(raw.systems)) {
      if (!y || !freeId(y.id)) { warn.push('system'); continue; }
      doc.systems[y.id] = { id: y.id, x: num(y.x), y: num(y.y), name: str(y.name, 30) };
    }
    for (const e of values(raw.ties)) {
      const ok = e && freeId(e.id) && e.a !== e.b && tieEndExists(doc, e.a) && tieEndExists(doc, e.b);
      if (!ok) { warn.push('tie'); continue; }
      doc.ties[e.id] = { id: e.id, a: e.a, b: e.b,
        strength: has(TIE_STRENGTHS, e.strength) ? e.strength : 'normal',
        stress: !!e.stress,
        dir: has(TIE_DIRS, e.dir) ? e.dir : '',
        note: str(e.note, 60) };
    }
    // 流水號至少要大於現存最大編號，之後新增才不會撞 id
    let maxSeq = Math.max(0, Math.floor(Number(raw.seq)) || 0);
    for (const coll of [doc.persons, doc.unions, doc.relations, doc.households, doc.labels, doc.systems, doc.ties])
      for (const id of Object.keys(coll)) { const n = parseInt(id.replace(/^\D+/, ''), 10); if (n > maxSeq) maxSeq = n; }
    for (const f of doc.settings.fields) { const n = parseInt(String(f.key).replace(/^f/, ''), 10); if (/^f\d+$/.test(f.key) && n > maxSeq) maxSeq = n; }
    doc.seq = maxSeq;
    return { doc, warnings: warn };
  }

  function serialize(doc) {
    return JSON.stringify(Object.assign({}, doc, { format: FORMAT, version: VERSION }), null, 1);
  }

  // ── 錯誤咽喉（模式 18／鐵律 11）：使用者只看到「狀態＋下一步＋代碼」，技術細節只進記錄 ──
  const MESSAGES = {
    OPEN:      '檔案無法開啟：格式不符或檔案已損毀。請確認選的是本工具存的家系圖檔（.json）。',
    TOO_LARGE: '檔案太大，不像是一般的家系圖檔，已停止讀取。請確認選的是正確的檔案。',
    SAVE:      '儲存失敗，檔案沒有寫入。請再按一次「儲存」，或改用「另存新檔」存到其他位置。',
    EXPORT:    '匯出圖片失敗，沒有產生檔案。請再試一次；若持續發生，請改用「匯出 SVG」。',
    CLIPBOARD: '無法複製到剪貼簿（瀏覽器沒有允許）。請改用「匯出 PNG」，再從 Word 插入圖片。',
    UNEXPECTED:'發生未預期的狀況，剛才的操作可能沒有完成。建議先按「另存新檔」保存目前的圖。',
  };
  const log = [];   // 記錄（最多 200 筆）；只在開發者工具主控台看得到

  function randHex(n) {
    const a = new Uint8Array(n);
    if (globalThis.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.from(a, b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  function fail(code, err) {
    const c = MESSAGES[code] ? code : 'UNEXPECTED';
    const ref = `${c}-${randHex(2)}`;
    log.push({ time: new Date().toISOString(), ref, code: c, detail: err ? String((err && err.stack) || err) : '' });
    if (log.length > 200) log.shift();
    if (globalThis.console && !GT.quietLog) console.error('[家系圖工具]', ref, err);
    return { ref, message: `${MESSAGES[c]}（代碼 ${ref}）` };
  }

  Object.assign(GT, {
    FORMAT, VERSION, S, GRID, GAP_X, GAP_Y,
    FAMILY_CATS, FAMILY_TYPES, CHILD_LINKS, TWIN_KINDS, EMOTION_CATS, EMOTION_TYPES, GENDERS, DEFAULT_FIELDS,
    LIFE_STATES, CULTURES, ILLNESS, SUBSTANCE, CONDITIONS, V1_UNION, V1_RELATION,
    SYSTEM_CATS, SYSTEM_PRESETS, TIE_STRENGTHS, TIE_DIRS, VIEW_MODES,
    labelOf, clone, snap, todayISO, defaultFileName,
    newDoc, newId, parseDate, formatDate, yearsBetween, ageOf,
    charEm, textEm, wrapText, labelLines, LABEL_WRAP_EM, suggestionsFor,
    addField, renameField, fieldUsage, removeField, moveField,
    unionsOf, parentUnionOf, unionBetween,
    addPerson, linkPartners, addPartner, addChild, addChildToPerson, addParents, addSibling, attachChild,
    commonParentUnion, setTwins, twinGroupOf, clearTwin,
    addRelation, addHousehold, addLabel, moveItems, snapItems, deleteItems,
    addSystem, addTie, tieBetween, tieEndExists, BASIC_LINE_TYPES, isSpecialLine,
    History, normalizeDoc, serialize, FormatError,
    MESSAGES, log, fail,
  });
})(globalThis.GT = globalThis.GT || {});

</script>
<script>
/* 家系圖工具 — render.js
 * 純函式：文件 → SVG 字串。畫面顯示與匯出圖片共用同一套，所見即所得。
 * 安全：所有使用者文字一律經 esc() 跳脫後才放進 SVG（畫面用 innerHTML 更新）。
 * 符號與線型依據：GenoPro「Genogram Symbols 基本常用家族圖符號」參考圖（使用者提供，2026-09-17）。
 */
(function (GT) {
  'use strict';

  const C = {                       // 介面配色＝共用設計系統 UI_Design.md
    INK: '#173F52', INK_SOFT: '#5B7688', MUTED: '#8AA2B1', BRAND: '#2E86AB', CYAN: '#38BDF8',
    OK: '#12855A', WARN: '#B26A00', HEART: '#E23A3A', DARK_RED: '#A3161C', WHITE: '#FFFFFF',
  };
  // 家系圖線條配色＝參考圖；「情感關係線用彩色」關掉時一律改成 INK（黑白列印靠線型區分）
  const G = {
    BLACK: '#1F2328', MAROON: '#8B1A1A', BLUE: '#1F4FD1', PINK: '#E0457B', GREEN: '#2E8B3E',
    RED: '#E0201B', ABUSE: '#1D4ED8', PURPLE: '#6A2CA0', LIGHT_GREEN: '#5DBB63',
  };
  // 黑白模式下原本只靠顏色區分的類型改畫灰色（使用者 2026-09-18：和諧相處跟一般在黑白、灰階列印時要分得出來）
  const BW_GRAY = { Harmony: '#9A9A9A' };
  const INDEX_FILL = '#E4E4E4';     // 案主（指標人物）灰底——刻意比「疑似濫用」的灰淺很多，兩者同時出現也分得出來
  const SUSPECT_FILL = '#8A8A8A';   // 疑似酒精或藥物濫用（參考圖：下半部灰色）
  const FONT = "'Microsoft JhengHei UI','Microsoft JhengHei','微軟正黑體','Noto Sans TC','PingFang TC',sans-serif";
  const HALF = GT.S / 2;
  const DROP = 22;                  // 伴侶線在符號下方多深
  const NAME_PX = 13, ATTR_PX = 12, LINE_H = 16;

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const f = (n) => (Number.isFinite(n) ? Math.round(n * 10) / 10 : 0);   // 座標取一位小數，杜絕 NaN
  const tint = (doc, color) => (doc.settings.colorRelations ? color : C.INK);

  // ── 家庭關係線型（GenoPro 26 種；參考圖 20 種）：color 線色、dash 虛線、house 同居記號、slash 斜線數、double 雙線 ──
  const FAMILY_STYLE = {
    Marriage:                                { color: G.BLACK },
    Widowed:                                 { color: G.BLACK },
    Separation:                              { color: G.MAROON, slash: 1 },
    SeparationLegal:                         { color: G.MAROON, slash: 1, bold: true },
    Divorce:                                 { color: G.MAROON, slash: 2 },
    Nullity:                                 { color: G.MAROON, slash: 3 },
    Engagement:                              { color: G.BLUE, dash: '8 4' },
    EngagementAndCohabitation:               { color: G.BLUE, dash: '8 4', house: true },
    EngagementAndSeparation:                 { color: G.BLUE, dash: '8 4', slash: 1 },
    LegalCohabitation:                       { color: G.BLUE, dash: '10 3 2 3', house: true },
    LegalCohabitationAndSeparation:          { color: G.BLUE, dash: '10 3 2 3', house: true, slash: 1 },
    LegalCohabitationAndLegalSeparation:     { color: G.BLUE, dash: '10 3 2 3', house: true, slash: 2 },
    Cohabitation:                            { color: G.BLUE, dash: '2 3', house: true },
    CohabitationAndSeparation:               { color: G.BLUE, dash: '2 3', house: true, slash: 1 },
    NonSentimentalCohabitation:              { color: G.BLUE, dash: '1 5', house: true },
    NonSentimentalCohabitationAndSeparation: { color: G.BLUE, dash: '1 5', house: true, slash: 1 },
    CommittedRelationship:                   { color: G.BLUE, dash: '12 3', double: true },
    CommittedRelationshipAndSeparation:      { color: G.BLUE, dash: '12 3', double: true, slash: 1 },
    CasualRelationship:                      { color: G.BLUE, dash: '2 4' },
    CasualRelationshipAndSeparation:         { color: G.BLUE, dash: '2 4', slash: 1 },
    TemporaryRelation:                       { color: G.BLUE, dash: '1 6' },
    Liaison:                                 { color: G.BLUE, dash: '4 4' },
    LoveAffair:                              { color: G.PINK, dash: '6 4' },
    LoveAffairAndSeparation:                 { color: G.PINK, dash: '6 4', slash: 1 },
    Rape:                                    { color: G.MAROON, dash: '2 3' },
    Other:                                   { color: C.MUTED, dash: '1 4' },
  };
  const CHILD_STYLE = { bio: { dash: '' }, adopted: { dash: '6 4' }, foster: { dash: '2 3', color: G.GREEN } };
  const PET_LINK = { dash: '6 4', color: G.BLUE };   // 參考圖：寵物用藍色虛線

  // ── 符號幾何：各種符號的上下緣（伴侶線、親子線、標籤都依它定位）──
  function symExtent(p) {
    if (p.life === 'miscarriage') return { top: 6, bottom: 6 };
    if (p.life === 'abortion') return { top: 7, bottom: 7 };
    if (p.life === 'pregnancy') return { top: 15, bottom: 13 };
    if (p.gender === 'P') return { top: 22, bottom: 22 };
    return { top: HALF, bottom: HALF };
  }
  const symTop = (p) => p.y - symExtent(p).top;
  const symBottom = (p) => p.y + symExtent(p).bottom;
  const CULTURE_H = 28;              // 移民／多元文化波浪線佔的高度（畫在符號正上方）
  // 年齡寫在符號裡的只有方、圓、菱形；「?」與懷孕／流產／墮胎改寫在標籤
  const ageInside = (p) => !p.life && p.gender !== 'U';

  // ── 人物 ──
  function labelBox(doc, p) {
    const lines = GT.labelLines(doc, p).slice();
    if (!ageInside(p) && !p.life) {
      const a = GT.ageOf(doc, p).value;
      if (a !== null) lines.splice(lines.length && lines[0].kind === 'name' ? 1 : 0, 0, { text: `${a} 歲`, kind: 'attr' });
    }
    const w = Math.max(GT.S, ...lines.map(l => GT.textEm(l.text) * (l.kind === 'name' ? NAME_PX : ATTR_PX)));
    return { lines, w, h: lines.length ? lines.length * LINE_H + 6 : 0 };
  }

  // 形狀外框（M 方、F 圓、P 菱形）；inset＞0 畫在內側（多種成癮時的第二、三道框）
  function outline(gender, inset, attrs) {
    const h = HALF - inset;
    if (gender === 'M') return `<rect x="${-h}" y="${-h}" width="${2 * h}" height="${2 * h}" ${attrs}/>`;
    if (gender === 'F') return `<circle r="${h}" ${attrs}/>`;
    const d = h * 1.12;
    return `<polygon points="0,${f(-d)} ${f(d)},0 0,${f(d)} ${f(-d)},0" ${attrs}/>`;
  }

  // 成癮與疾病的區塊（參考圖左欄）：疾病＝左半、濫用＝下半；疾病別顏色填左上格
  function healthMarkup(doc, p) {
    if (p.gender !== 'M' && p.gender !== 'F') return '';
    const med = (p.conditions || []).map(k => GT.CONDITIONS.find(c => c.key === k)).filter(c => c && c.kind === 'medical');
    if (!p.illness && !p.substance && !med.length) return '';
    const h = HALF, sq = p.gender === 'M', out = [];
    const region = (which) => {       // left / bottom / tl 三種區塊的路徑
      if (sq) return which === 'left' ? `M${-h},${-h}H0V${h}H${-h}Z` : which === 'bottom' ? `M${-h},0H${h}V${h}H${-h}Z` : `M${-h},${-h}H0V0H${-h}Z`;
      return which === 'left' ? `M0,${-h}A${h},${h} 0 0 0 0,${h}Z` : which === 'bottom' ? `M${-h},0A${h},${h} 0 0 0 ${h},0Z` : `M0,0V${-h}A${h},${h} 0 0 0 ${-h},0Z`;
    };
    const ink = doc.settings.colorRelations ? G.BLACK : C.INK;
    if (p.illness) out.push(`<path d="${region('left')}" fill="${ink}"/>`);
    if (p.substance) out.push(`<path d="${region('bottom')}" fill="${p.substance === 'suspected' ? SUSPECT_FILL : ink}"/>`);
    if (med.length) {                 // 疾病別：左上格塗色，多種就分成直條
      const w = h / med.length;
      const clip = `hq-${esc(p.id)}`;
      out.push(`<clipPath id="${clip}"><path d="${region('tl')}"/></clipPath><g clip-path="url(#${clip})">` +
               med.map((c, i) => `<rect x="${f(-h + i * w)}" y="${-h}" width="${f(w + 0.3)}" height="${h}" fill="${tint(doc, c.color)}"/>`).join('') + '</g>');
    }
    // 復原中：塗色區中間留白（參考圖的「空心」效果）；留白不畫到另一軸仍在發作的區塊上
    const illActive = p.illness && p.illness !== 'recovery', subActive = p.substance && p.substance !== 'recovery';
    if (p.illness === 'recovery') {
      out.push(sq ? `<rect x="${-h + 5}" y="${-h + 5}" width="${h - 10}" height="${subActive ? h - 10 : 2 * h - 10}" fill="#FFFFFF"/>`
                  : `<circle cx="${f(-h * 0.45)}" cy="${subActive ? f(-h * 0.4) : 0}" r="${f(h * 0.28)}" fill="#FFFFFF"/>`);
    }
    if (p.substance === 'recovery') {
      out.push(sq ? `<rect x="${illActive ? 5 : -h + 5}" y="5" width="${illActive ? h - 10 : 2 * h - 10}" height="${h - 10}" fill="#FFFFFF"/>`
                  : `<circle cx="${illActive ? f(h * 0.4) : 0}" cy="${f(h * 0.45)}" r="${f(h * 0.28)}" fill="#FFFFFF"/>`);
    }
    return out.join('');
  }

  // 移民／多元文化：符號正上方的波浪線（白底襯著，會把親子線斷開，跟參考圖一樣）
  function cultureMarkup(doc, p) {
    if (!p.culture) return '';
    const y0 = -symExtent(p).top - 2;
    // 一個 S 形彎（由下往上）；多元文化＝兩條並排
    const loop = (x) => `M${x},${y0}C${x + 7},${y0 - 3} ${x + 7},${y0 - 9} ${x},${y0 - 11}C${x - 7},${y0 - 13} ${x - 7},${y0 - 19} ${x},${y0 - 22}`;
    const d = p.culture === 'multiple' ? loop(-4) + loop(4) : loop(0);
    const color = tint(doc, G.BLACK);
    return `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>` +
           `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>`;
  }

  function symbolMarkup(doc, p) {
    const out = [];
    const ink = tint(doc, G.BLACK);
    const addictions = (p.conditions || []).map(k => GT.CONDITIONS.find(c => c.key === k)).filter(c => c && c.kind === 'addiction');
    const border = addictions.length ? tint(doc, addictions[0].color) : ink;
    const sw = p.index ? 3.6 : 2;                       // 案主＝框線加粗＋灰底
    const fill = p.index ? INDEX_FILL : '#FFFFFF';
    if (p.life === 'pregnancy') {
      out.push(`<polygon points="0,-15 14,13 -14,13" fill="${fill}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round"/>`);
    } else if (p.life === 'miscarriage') {
      out.push(`<circle r="5.5" fill="${ink}"/>`);
    } else if (p.life === 'abortion') {
      out.push(`<path d="M-6,-6L6,6M6,-6L-6,6" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`);
    } else if (p.gender === 'U') {                       // 參考圖：未知性別＝「?」
      if (p.index) out.push(`<rect x="-16" y="-20" width="32" height="40" rx="4" fill="${INDEX_FILL}" stroke="${ink}" stroke-width="${sw}"/>`);
      out.push(`<text y="13" text-anchor="middle" font-size="36" font-weight="700" fill="${ink}">?</text>`);
    } else {
      out.push(outline(p.gender, 0, `fill="${fill}"`));
      out.push(healthMarkup(doc, p));
      out.push(outline(p.gender, 0, `fill="none" stroke="${border}" stroke-width="${sw}"`));
      addictions.slice(1).forEach((c, i) => out.push(outline(p.gender, 3.5 * (i + 1) + sw / 2, `fill="none" stroke="${tint(doc, c.color)}" stroke-width="1.8"`)));
    }
    if (p.deceased && !p.life) {
      const k = p.gender === 'M' ? HALF : p.gender === 'F' ? HALF * 0.72 : p.gender === 'P' ? HALF * 0.62 : HALF * 0.7;
      out.push(`<path d="M${f(-k)},${f(-k)}L${f(k)},${f(k)}M${f(k)},${f(-k)}L${f(-k)},${f(k)}" stroke="${ink}" stroke-width="1.8" stroke-opacity="0.8"/>`);
    }
    if (ageInside(p)) {
      const age = GT.ageOf(doc, p).value;
      if (age !== null) {
        const fs = age >= 100 ? 12 : 15;
        const halo = p.deceased || p.illness || p.substance || p.index ? 3.5 : 0;
        out.push(`<text class="age" y="${fs / 3 + 0.5}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${C.INK}" stroke="#FFFFFF" stroke-width="${halo}" paint-order="stroke">${age}</text>`);
      }
    }
    out.push(cultureMarkup(doc, p));
    return out.join('');
  }

  function personMarkup(doc, p, o) {
    const sel = o.selection && o.selection.has(p.id);
    const pend = o.pending === p.id;
    const lb = labelBox(doc, p), e = symExtent(p);
    const ctop = e.top + (p.culture ? CULTURE_H : 0);
    const out = [`<g class="person" data-id="${esc(p.id)}" data-kind="person" transform="translate(${f(p.x)},${f(p.y)})">`];
    if (!o.forExport && (sel || pend)) {
      const w = Math.max(lb.w, GT.S) + 16, h = ctop + e.bottom + 20 + lb.h;
      out.push(`<rect class="sel" x="${f(-w / 2)}" y="${-ctop - 10}" width="${f(w)}" height="${f(h)}" rx="10" fill="${pend ? C.WARN : C.CYAN}" fill-opacity="0.12" stroke="${pend ? C.WARN : C.CYAN}" stroke-width="2" stroke-dasharray="${pend ? '4 3' : ''}"/>`);
    }
    out.push(symbolMarkup(doc, p));
    let y = e.bottom + 15;
    // 標籤整塊白底（GenoPro 同樣做法）：往下的伴侶／親子線從標籤後面經過，不會在字縫間露出來
    if (lb.lines.length) out.push(`<rect x="${f(-lb.w / 2 - 3)}" y="${e.bottom + 2}" width="${f(lb.w + 6)}" height="${lb.h - 2}" fill="${C.WHITE}" fill-opacity="0.92" rx="3"/>`);
    for (const l of lb.lines) {
      const isName = l.kind === 'name';
      out.push(`<text y="${y}" text-anchor="middle" font-size="${isName ? NAME_PX : ATTR_PX}" font-weight="${isName ? 700 : 400}" fill="${isName ? C.INK : C.INK_SOFT}" stroke="${C.WHITE}" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${esc(l.text)}</text>`);
      y += LINE_H;
    }
    if (!o.forExport) {
      const w = Math.max(lb.w, GT.S);
      out.push(`<rect class="hit" x="${f(-w / 2 - 4)}" y="${-ctop - 6}" width="${f(w + 8)}" height="${f(ctop + e.bottom + 12 + lb.h)}" fill="transparent"/>`);
    }
    out.push('</g>');
    return out.join('');
  }

  // ── 伴侶線與親子線 ──
  const TIER = 14;   // 同一人的多段關係橫線重疊時，每段往下錯開的距離
  // 這段關係要往下錯開幾層：比它早建立、跟它共用一位伴侶、而且橫線範圍重疊的關係有幾段
  function unionTier(doc, u) {
    const span = (x) => { const xs = x.partners.map(id => doc.persons[id]).filter(Boolean).map(p => p.x); return [Math.min(...xs), Math.max(...xs)]; };
    const [a1, a2] = span(u);
    let tier = 0;
    for (const o of Object.values(doc.unions)) {
      if (o === u) break;                      // 物件鍵依建立順序排列（id 流水號）
      if (o.partners.length !== 2 || !o.partners.some(id => u.partners.includes(id))) continue;
      const [b1, b2] = span(o);
      if (Math.min(a2, b2) - Math.max(a1, b1) > 1) tier++;
    }
    return tier;
  }

  function unionGeometry(doc, u) {
    const ps = u.partners.map(id => doc.persons[id]).filter(Boolean).sort((a, b) => a.x - b.x);
    if (!ps.length) return null;
    const kids = u.children.map(c => ({ c, p: doc.persons[c.id] })).filter(k => k.p);
    let yLine, midX, legs = '';
    const legPath = (y) => `M${f(ps[0].x)},${f(symBottom(ps[0]))}V${f(y)}M${f(ps[1].x)},${f(symBottom(ps[1]))}V${f(y)}`;
    if (ps.length === 2) {
      const [A, B] = ps;
      // 伴侶線放在兩人標籤文字的下方，不從「工人」「低收入戶」這些字中間橫切過去
      const below = (p) => symBottom(p) + labelBox(doc, p).h + 10;
      yLine = Math.max(symBottom(A) + DROP, symBottom(B) + DROP, below(A), below(B)) + TIER * unionTier(doc, u);
      midX = (A.x + B.x) / 2;
    } else {
      yLine = symBottom(ps[0]);
      midX = ps[0].x;
    }
    let ySib = null;
    if (kids.length) {
      const top = Math.min(...kids.map(k => symTop(k.p) - (k.p.culture ? CULTURE_H : 0)));
      const pb = Math.max(...ps.map(p => symBottom(p)));
      // 子女被拖得太靠近父母時，伴侶線往上縮（寧可壓到標籤，也不要讓線往上折）
      if (ps.length === 2 && yLine > top - 20) yLine = Math.max(pb + 8, top - 20);
      ySib = Math.max(yLine, Math.min(Math.max(yLine + 14, top - 26), top - 6));
    }
    if (ps.length === 2) legs = legPath(yLine);
    const marriage = ps.length === 2 ? `${legs}M${f(ps[0].x)},${f(yLine)}H${f(ps[1].x)}` : '';
    return { ps, kids, yLine, midX, legs, marriage, ySib };
  }

  // 伴侶線上的同居記號與斜線放在哪裡（畫線與擺線旁說明共用，兩邊才不會各算各的）
  function unionMarks(g, st) {
    const [A, B] = g.ps, at = (r) => A.x + (B.x - A.x) * r, hasKids = g.kids.length > 0;
    return { house: st.house ? at(hasKids ? 0.28 : st.slash ? 0.38 : 0.5) : null,
             slash: st.slash ? at(st.house ? 0.72 : hasKids ? 0.3 : 0.5) : null };
  }

  // 同居記號（參考圖的小房子）與斜線
  const houseMark = (x, y, color) =>
    `<path class="house" d="M${f(x - 6)},${f(y + 5)}V${f(y - 2)}L${f(x)},${f(y - 8)}L${f(x + 6)},${f(y - 2)}V${f(y + 5)}Z" fill="#FFFFFF" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>`;
  function slashMarks(x, y, n, color, bold) {
    let d = '';
    for (let i = 0; i < n; i++) { const dx = (i - (n - 1) / 2) * 7; d += `M${f(x + dx - 5)},${f(y + 8)}L${f(x + dx + 5)},${f(y - 8)}`; }
    return `<path class="slash" d="${d}" stroke="${color}" stroke-width="${bold ? 3.4 : 2}" stroke-linecap="round"/>`;
  }

  function unionMarkup(doc, u, o) {
    const g = unionGeometry(doc, u);
    if (!g) return '';
    const sel = o.selection && o.selection.has(u.id);
    const st = FAMILY_STYLE[u.type] || FAMILY_STYLE.Other;
    const color = tint(doc, st.color), ink = tint(doc, G.BLACK);
    const out = [`<g class="union" data-id="${esc(u.id)}" data-kind="union">`];
    const twinOf = new Map();
    for (const t of (u.twins || [])) for (const id of t.ids) twinOf.set(id, t);
    let trunk = '';
    if (g.kids.length) {
      const xs = g.kids.map(k => k.p.x).concat([g.midX]);
      trunk = `M${f(g.midX)},${f(g.yLine)}V${f(g.ySib)}M${f(Math.min(...xs))},${f(g.ySib)}H${f(Math.max(...xs))}`;
    }
    if (sel) out.push(`<path d="${g.marriage}${trunk}" fill="none" stroke="${C.CYAN}" stroke-width="7" stroke-opacity="0.45" stroke-linejoin="round"/>`);
    if (g.ps.length === 2) {
      const [A, B] = g.ps, y = g.yLine, dash = st.dash || '';
      out.push(`<path d="${g.legs}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${dash}"/>`);
      const hz = (dy) => `<path d="M${f(A.x)},${f(y + dy)}H${f(B.x)}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${dash}"/>`;
      out.push(st.double ? hz(-2.5) + hz(2.5) : hz(0));
      const m = unionMarks(g, st);                // 記號位置：有子女時避開正中間的子女線
      if (m.house !== null) out.push(houseMark(m.house, y, color));
      if (m.slash !== null) out.push(slashMarks(m.slash, y, st.slash, color, st.bold));
    }
    if (trunk) out.push(`<path d="${trunk}" fill="none" stroke="${ink}" stroke-width="2"/>`);
    const kidLine = (k) => {
      const cs = k.p.gender === 'P' ? PET_LINK : (CHILD_STYLE[k.c.link] || CHILD_STYLE.bio);
      return { dash: cs.dash, color: cs.color ? tint(doc, cs.color) : ink };
    };
    const topOf = (p) => symTop(p) - (p.culture ? CULTURE_H - 4 : 0);
    for (const k of g.kids) {
      if (twinOf.has(k.c.id)) continue;
      const s = kidLine(k);
      out.push(`<path d="M${f(k.p.x)},${f(g.ySib)}V${f(topOf(k.p))}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash}"/>`);
    }
    // 雙胞胎：從同一點分岔（倒 V）；同卵在兩線之間加橫槓；不確定加「?」
    const drawn = new Set();
    let twinHit = '';
    for (const t of (u.twins || [])) {
      if (drawn.has(t)) continue;
      drawn.add(t);
      const mem = g.kids.filter(k => t.ids.includes(k.c.id)).sort((a, b) => a.p.x - b.p.x);
      if (mem.length < 2) continue;
      const ax = mem.reduce((s, k) => s + k.p.x, 0) / mem.length, ay = g.ySib;
      for (const k of mem) {
        const s = kidLine(k);
        const d = `M${f(ax)},${f(ay)}L${f(k.p.x)},${f(topOf(k.p))}`;
        twinHit += d;
        out.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash}"/>`);
      }
      const pt = (k, r) => ({ x: ax + (k.p.x - ax) * r, y: ay + (topOf(k.p) - ay) * r });
      if (t.kind === 'Identical') {
        const a = pt(mem[0], 0.55), b = pt(mem[mem.length - 1], 0.55);
        out.push(`<path class="twin-bar" d="M${f(a.x)},${f(a.y)}L${f(b.x)},${f(b.y)}" stroke="${ink}" stroke-width="2"/>`);
      } else if (t.kind === 'Unknown') {
        const a = pt(mem[0], 0.6), b = pt(mem[mem.length - 1], 0.6);
        out.push(`<text x="${f((a.x + b.x) / 2)}" y="${f(a.y + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="${ink}">?</text>`);
      }
    }
    if (!o.forExport) {
      const kidLines = g.kids.filter(k => !twinOf.has(k.c.id)).map(k => `M${f(k.p.x)},${f(g.ySib)}V${f(topOf(k.p))}`).join('');
      out.push(`<path class="hit" d="${g.marriage}${trunk}${kidLines}${twinHit}" fill="none" stroke="transparent" stroke-width="12"/>`);
    }
    out.push('</g>');
    return out.join('');
  }

  // ── 情感關係線 ──
  /* 軌跡：兩人中心的直線；途中被別人（符號或標籤）擋住 → 改成二次曲線繞開（先試往上彎）。
     曾經直線穿過中間的人，中斷記號被那人的符號蓋住，讀起來變成跟那個人有關係——報告上會被誤讀。
     兩端從「符號＋標籤」整塊的外緣起算，往下的線不會先穿過自己的名字。各種線型都沿軌跡畫。 */
  function shapeBoxes(doc, p, pad) {           // 一個人佔的範圍：符號框（含文化波浪線）＋（有的話）標籤框
    const e = symExtent(p), lb = labelBox(doc, p), w = Math.max(e.top, 6);
    const boxes = [{ x1: p.x - w - pad, y1: p.y - e.top - (p.culture ? CULTURE_H : 0) - pad, x2: p.x + w + pad, y2: p.y + e.bottom + pad }];
    if (lb.lines.length) boxes.push({ x1: p.x - lb.w / 2 - pad, y1: p.y + e.bottom, x2: p.x + lb.w / 2 + pad, y2: p.y + e.bottom + lb.h + pad });
    return boxes;
  }
  const inBoxes = (pt, boxes) => boxes.some(b => pt.x > b.x1 && pt.x < b.x2 && pt.y > b.y1 && pt.y < b.y2);

  function sampleCurve(ax, ay, bx, by, cx, cy) {   // cx 為 null＝直線
    const n = Math.max(8, Math.ceil(Math.hypot(bx - ax, by - ay) * (cx == null ? 1 : 1.4) / 3));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push(cx == null ? { x: ax + (bx - ax) * t, y: ay + (by - ay) * t }
                          : { x: u * u * ax + 2 * u * t * cx + t * t * bx, y: u * u * ay + 2 * u * t * cy + t * t * by });
    }
    return pts;
  }

  function relationTrack(doc, A, B) {
    const reach = 220;                            // 最大彎曲幅度以外的人不可能擋到，先排除（拖曳時要夠快）
    const bx1 = Math.min(A.x, B.x) - reach, bx2 = Math.max(A.x, B.x) + reach;
    const by1 = Math.min(A.y, B.y) - reach, by2 = Math.max(A.y, B.y) + reach;
    const obstacles = Object.values(doc.persons)
      .filter(p => p !== A && p !== B && p.x > bx1 && p.x < bx2 && p.y > by1 && p.y < by2)
      .map(p => shapeBoxes(doc, p, 4));
    const hits = (pts) => obstacles.filter(bs => pts.some(pt => inBoxes(pt, bs))).length;
    let pts = sampleCurve(A.x, A.y, B.x, B.y, null, null), straight = true;
    if (obstacles.length && hits(pts)) {
      const len = Math.hypot(B.x - A.x, B.y - A.y) || 1;
      let nx = -(B.y - A.y) / len, ny = (B.x - A.x) / len;
      if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }   // 先試往上（或往左）彎
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      let best = null;
      search: for (const bow of [36, 60, 90, 130, 180]) {
        for (const side of [1, -1]) {
          const cand = sampleCurve(A.x, A.y, B.x, B.y, mx + nx * bow * side * 2, my + ny * bow * side * 2);
          const h = hits(cand);
          if (!best || h < best.h) best = { h, pts: cand };
          if (!h) break search;
        }
      }
      pts = best.pts; straight = false;
    }
    const aBox = shapeBoxes(doc, A, 6), bBox = shapeBoxes(doc, B, 6);   // 兩端修掉落在自己範圍裡的部分
    let i = 0, j = pts.length - 1;
    while (i < j && inBoxes(pts[i], aBox)) i++;
    while (j > i && inBoxes(pts[j], bBox)) j--;
    return { pts: pts.slice(i, j + 1), straight };
  }

  // 軌跡工具：總長、沿線距離 s 處的位置＋切線＋法線、等距重新取樣
  function trackInfo(pts) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    const at = (s) => {
      let i = 1;
      while (i < pts.length - 1 && cum[i] < s) i++;
      const seg = cum[i] - cum[i - 1] || 1, t = Math.max(0, Math.min(1, (s - cum[i - 1]) / seg));
      const ux = (pts[i].x - pts[i - 1].x) / seg, uy = (pts[i].y - pts[i - 1].y) / seg;
      return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t, ux, uy, nx: -uy, ny: ux };
    };
    const along = (step, a, b) => {
      const n = Math.max(1, Math.round((b - a) / step)), out = [];
      for (let k = 0; k <= n; k++) out.push(at(a + (b - a) * k / n));
      return out;
    };
    return { L: cum[cum.length - 1], at, along };
  }
  const polyD = (qs, off) => qs.map((q, k) => `${k ? 'L' : 'M'}${f(q.x + q.nx * off)},${f(q.y + q.ny * off)}`).join('');
  const zigD = (qs, amp) => qs.map((q, k) => {
    const s = k === 0 || k === qs.length - 1 ? 0 : (k % 2 ? amp : -amp);
    return `${k ? 'L' : 'M'}${f(q.x + q.nx * s)},${f(q.y + q.ny * s)}`;
  }).join('');

  // 情感關係配色＝參考圖（綠＝親近、紅＝衝突／暴力／控制、藍紫＝虐待、黑＝中性與關注）
  const EMOTION_COLOR = {
    Harmony: G.LIGHT_GREEN, Friendship: G.GREEN, Intimacy: G.GREEN, Love: G.GREEN, InLove: G.GREEN, Psyritual: G.GREEN,
    CutoffRepaired: G.GREEN, Caretaker: G.GREEN, Fused: G.RED,
    Indifferent: G.BLACK, Distant: G.BLACK, NeverMet: G.BLACK, Plain: G.BLACK,
    FocusedOn: G.BLACK, FocusedOnNegatively: G.BLACK, Fan: G.BLACK, Limerence: G.BLACK,
    Cutoff: G.RED, Discord: G.RED, Hate: G.RED, Distrust: G.RED, Hostile: G.RED,
    HostileDistant: G.RED, HostileClose: G.RED, HostileFused: G.RED,
    Violence: G.RED, ViolenceDistant: G.RED, ViolenceClose: G.RED, ViolenceFused: G.RED,
    Manipulative: G.RED, Controlling: G.RED, Jealous: G.RED,
    Abuse: G.PURPLE, AbusePhysical: G.ABUSE, AbuseEmotional: G.ABUSE, AbuseSexual: G.ABUSE, AbuseNeglect: G.ABUSE,
    Other: C.MUTED,
  };

  function relationMarkup(doc, r, o) {
    const A = doc.persons[r.a], B = doc.persons[r.b];
    if (!A || !B) return '';
    const { pts, straight } = relationTrack(doc, A, B);
    if (pts.length < 2) return '';
    const tk = trackInfo(pts), L = tk.L;
    if (L < 12) return '';
    const color = doc.settings.colorRelations ? (EMOTION_COLOR[r.type] || C.MUTED) : (BW_GRAY[r.type] || C.INK);
    const fine = straight ? [tk.at(0), tk.at(L)] : tk.along(3, 0, L);
    const at = (s) => tk.at(Math.max(0, Math.min(L, s)));
    const mid = at(L / 2);
    // ── 線型零件（全部沿軌跡畫，曲線繞道時一樣適用）──
    const line = (off, extra, w) => `<path d="${polyD(fine, off)}" stroke="${color}" stroke-width="${w || 1.8}" fill="none" stroke-linejoin="round" ${extra || ''}/>`;
    const zz = (amp, wave, w, stroke) => `<path d="${zigD(tk.along(wave, 0, L), amp)}" stroke="${stroke || color}" stroke-width="${w || 1.8}" fill="none" stroke-linejoin="round"/>`;
    const dashed = (off) => line(off, 'stroke-dasharray="5 4"');
    const ticks = (step, len) => {           // 垂直短槓（知己的梯子、不信任的梳子）
      let d = '';
      for (let s = step; s < L - step / 2; s += step) { const q = at(s); d += `M${f(q.x + q.nx * len / 2)},${f(q.y + q.ny * len / 2)}L${f(q.x - q.nx * len / 2)},${f(q.y - q.ny * len / 2)}`; }
      return `<path d="${d}" stroke="${color}" stroke-width="1.5"/>`;
    };
    const ring = (q, r0, along) => `<circle cx="${f(q.x + q.ux * (along || 0))}" cy="${f(q.y + q.uy * (along || 0))}" r="${r0}" fill="#FFFFFF" stroke="${color}" stroke-width="1.8"/>`;
    const xMark = (q, s) => `<path d="M${f(q.x - (q.ux + q.nx) * s)},${f(q.y - (q.uy + q.ny) * s)}L${f(q.x + (q.ux + q.nx) * s)},${f(q.y + (q.uy + q.ny) * s)}` +
                            `M${f(q.x - (q.ux - q.nx) * s)},${f(q.y - (q.uy - q.ny) * s)}L${f(q.x + (q.ux - q.nx) * s)},${f(q.y + (q.uy - q.ny) * s)}" stroke="${color}" stroke-width="2"/>`;
    const boxX = (q, s) => {
      const c = (a, b) => `${f(q.x + q.ux * a + q.nx * b)},${f(q.y + q.uy * a + q.ny * b)}`;
      return `<path d="M${c(-s, -s)}L${c(s, -s)}L${c(s, s)}L${c(-s, s)}Z" fill="#FFFFFF" stroke="${color}" stroke-width="1.8"/>` + xMark(q, s * 0.72);
    };
    const chevron = (s, size) => {           // 開口箭頭「>」，尖端在 s
      const q = at(s);
      return `<path class="arrow" d="M${f(q.x - q.ux * size + q.nx * size * 0.6)},${f(q.y - q.uy * size + q.ny * size * 0.6)}L${f(q.x)},${f(q.y)}L${f(q.x - q.ux * size - q.nx * size * 0.6)},${f(q.y - q.uy * size - q.ny * size * 0.6)}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    };
    const arrowHead = (hollow) => {          // 實心／空心三角箭頭（虐待類）
      const q = at(L - 1);
      return `<path class="arrow" d="M${f(q.x)},${f(q.y)}L${f(q.x - q.ux * 13 + q.nx * 7)},${f(q.y - q.uy * 13 + q.ny * 7)}L${f(q.x - q.ux * 13 - q.nx * 7)},${f(q.y - q.uy * 13 - q.ny * 7)}Z" fill="${hollow ? '#FFFFFF' : color}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>`;
    };
    const gapped = (extra, gap) => {         // 中間斷開的線（絕交、修復截斷）
      const g = gap || 7, a = at(L / 2 - g), b = at(L / 2 + g);
      const bar = (q) => `M${f(q.x + q.nx * 9)},${f(q.y + q.ny * 9)}L${f(q.x - q.nx * 9)},${f(q.y - q.ny * 9)}`;
      return `<path d="${polyD(tk.along(3, 0, L / 2 - g), 0)}${polyD(tk.along(3, L / 2 + g, L), 0)}" stroke="${color}" stroke-width="1.8" fill="none" ${extra || ''}/>` +
             `<path d="${bar(a)}${bar(b)}" stroke="${color}" stroke-width="2"/>`;
    };
    const out = [`<g class="relation" data-id="${esc(r.id)}" data-kind="relation">`];
    if (o.selection && o.selection.has(r.id)) out.push(`<path d="${polyD(fine, 0)}" stroke="${C.CYAN}" stroke-width="12" stroke-opacity="0.4" stroke-linecap="round" fill="none"/>`);
    switch (r.type) {
      // 親近
      case 'Harmony': out.push(line(0)); break;
      case 'Friendship': out.push(line(-2.5), line(2.5)); break;
      case 'Intimacy': out.push(line(-3), line(3), ticks(6, 10)); break;
      case 'Fused': out.push(line(-4.5), line(0), line(4.5)); break;
      case 'Love': out.push(line(0), ring(mid, 5.5)); break;
      case 'InLove': out.push(line(0), ring(mid, 5.5, -4.5), ring(mid, 5.5, 4.5)); break;
      case 'Psyritual': {
        const n = Math.max(2, Math.floor(L / 10));
        for (let i = 0; i < n; i++) out.push(ring(at(5 + i * (L - 10) / (n - 1)), 4.5));
        break;
      }
      // 疏離
      case 'Indifferent': out.push(line(0, 'stroke-dasharray="1 4" stroke-linecap="round"', 2.2)); break;
      case 'Distant': out.push(line(0, 'stroke-dasharray="7 5"')); break;
      case 'Cutoff': out.push(gapped('stroke-dasharray="6 4"')); break;
      case 'CutoffRepaired': out.push(gapped('stroke-dasharray="6 4"', 9), ring(mid, 4)); break;
      case 'NeverMet': out.push(line(0), boxX(mid, 6.5)); break;
      // 衝突
      case 'Discord': out.push(line(0, '', 2.4)); break;
      case 'Hate': out.push(dashed(-5), dashed(0), dashed(5)); break;
      case 'Distrust': out.push(line(0), ticks(5, 12)); break;
      case 'Hostile': out.push(zz(6, 12)); break;
      case 'HostileDistant': out.push(dashed(0), zz(6, 12)); break;
      case 'HostileClose': out.push(line(-3), line(3), zz(6, 12)); break;
      case 'HostileFused': out.push(line(-5), line(0), line(5), zz(6, 12)); break;
      // 暴力（較密的鋸齒）
      case 'Violence': out.push(zz(6, 6, 2.2)); break;
      case 'ViolenceDistant': out.push(dashed(0), zz(6, 6, 2.2)); break;
      case 'ViolenceClose': out.push(line(-3), line(3), zz(6, 6, 2.2)); break;
      case 'ViolenceFused': out.push(line(-5), line(0), line(5), zz(6, 6, 2.2)); break;
      // 虐待（有方向，箭頭指向受虐者）
      case 'Abuse': out.push(zz(5, 12, 2), arrowHead(false)); break;
      case 'AbusePhysical': out.push(zz(6, 12, 3), arrowHead(false)); break;
      case 'AbuseEmotional': out.push(line(0, '', 1.2), zz(5, 12, 1.8), arrowHead(false)); break;
      case 'AbuseSexual': out.push(zz(6, 12, 4), zz(6, 12, 1.6, '#FFFFFF'), arrowHead(true)); break;
      case 'AbuseNeglect': out.push(line(0, 'stroke-dasharray="6 4"'), chevron(L, 11)); break;
      // 控制與關注（有方向）
      case 'Manipulative': out.push(line(0), xMark(mid, 6), chevron(L, 11)); break;
      case 'Controlling': out.push(line(0), boxX(mid, 7), chevron(L, 11)); break;
      case 'Jealous': out.push(line(0, '', 2.2), chevron(L, 11)); break;
      case 'FocusedOn': out.push(line(0), chevron(L, 11)); break;
      case 'FocusedOnNegatively': out.push(zz(5, 12), chevron(L, 11)); break;
      case 'Fan': out.push(line(0), ring(mid, 5.5), chevron(L, 11)); break;
      case 'Limerence': out.push(line(0), ring(mid, 5.5, -5.5), ring(mid, 5.5, 5.5), chevron(L, 11)); break;
      // 一般
      case 'Plain': out.push(line(0)); break;
      case 'Caretaker': out.push(line(0), chevron(L - 9, 10), chevron(L, 10)); break;   // 參考圖的「≫」
      default: out.push(line(0, 'stroke-dasharray="1 4" stroke-linecap="round"'));
    }
    if (!o.forExport) out.push(`<path class="hit" d="${polyD(fine, 0)}" stroke="transparent" stroke-width="14" fill="none"/>`);
    out.push('</g>');
    return out.join('');
  }

  // ── 生活圈（虛線圈起同住成員）──
  function personBox(doc, p) {
    const lb = labelBox(doc, p), e = symExtent(p);
    const w = Math.max(GT.S, lb.w);
    return { x1: p.x - w / 2, y1: p.y - e.top - (p.culture ? CULTURE_H : 0), x2: p.x + w / 2, y2: p.y + e.bottom + lb.h + 4 };
  }

  /* 生活圈的形狀（不再是一個大矩形——大矩形會把不同住的人也圈進去，評估報告上等於錯誤陳述）：
     1. 成員依 y 分列（同一代）；
     2. 同一列中，兩位成員之間夾著非成員 → 斷成兩段，再從非成員的標籤下方用橫帶繞過去（凸形／U 形）；
     3. 相鄰兩列之間，用最近的兩段之間的連接帶接起來（L 形、階梯形）。
     回傳這些矩形；畫的時候只描它們聯集的外圈。 */
  const HH_PAD = 12;
  function householdParts(doc, h) {
    const mem = new Set(h.members);
    const items = h.members.map(id => doc.persons[id]).filter(Boolean).map(p => ({ p, b: personBox(doc, p) }));
    if (!items.length) return [];
    const others = Object.values(doc.persons).filter(p => !mem.has(p.id)).map(p => ({ p, b: personBox(doc, p) }));
    items.sort((a, b) => a.p.y - b.p.y || a.p.x - b.p.x);
    const rows = [];
    for (const it of items) {
      const row = rows.find(r => Math.abs(r.y - it.p.y) < GT.S);
      if (row) row.items.push(it); else rows.push({ y: it.p.y, items: [it] });
    }
    const pad = HH_PAD, parts = [], rowRuns = [];
    const boxOf = (run) => ({ x1: Math.min(...run.map(i => i.b.x1)) - pad, y1: Math.min(...run.map(i => i.b.y1)) - pad,
                              x2: Math.max(...run.map(i => i.b.x2)) + pad, y2: Math.max(...run.map(i => i.b.y2)) + pad });
    for (const row of rows) {
      row.items.sort((a, b) => a.p.x - b.p.x);
      const sameRow = others.filter(o => Math.abs(o.p.y - row.y) < GT.S);
      const runs = [[row.items[0]]];
      for (let i = 1; i < row.items.length; i++) {
        const prev = row.items[i - 1].p.x, cur = row.items[i].p.x;
        if (sameRow.some(o => o.p.x > prev && o.p.x < cur)) runs.push([row.items[i]]);
        else runs[runs.length - 1].push(row.items[i]);
      }
      const rr = runs.map(boxOf);
      if (rr.length > 1) {                       // 從夾在中間的非成員下方繞過
        const bottom = Math.max(...rr.map(r => r.y2), ...sameRow.map(o => o.b.y2 + pad));
        for (const r of rr) r.y2 = Math.max(r.y2, bottom + 2 * pad);
        for (let i = 1; i < rr.length; i++) parts.push({ x1: rr[i - 1].x2 - 2 * pad, y1: bottom, x2: rr[i].x1 + 2 * pad, y2: bottom + 2 * pad });
      }
      parts.push(...rr);
      rowRuns.push(rr);
    }
