<style>
/* 【產生檔，不要手改】來源：共用設計系統的基礎樣式
 * 複製日期：2026-10-28。要更新：由作者從設計系統重新複製。
 * 專案自己的樣式寫在 style.css，不要改這個檔。 */
/*
 * 共用基底：重設、中文排版、標題字級、連結、焦點、工具類別、列印與減少動效。
 * 只用 token（var(--…)），不寫色碼；任何一套 tokens.css 接上來都成立。
 * 讀取順序：tokens.css → base.css → components.css → 頁面自己的樣式。
 */

/* ---------- 重設 ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100dvh; }
img, picture, video, canvas, svg { display: block; max-width: 100%; }
input, button, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
ul[role="list"], ol[role="list"] { list-style: none; padding: 0; }
table { border-collapse: collapse; border-spacing: 0; }
hr { border: 0; border-top: var(--border-width) solid var(--border-soft); }
[hidden] { display: none !important; }

/* ---------- 文件層級 ---------- */
html {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  letter-spacing: var(--tracking-display);   /* 中文一律 0 */
  word-break: normal;
  overflow-wrap: anywhere;                    /* 長網址、長編號不撐破版面 */
  text-autospace: ideograph-alpha ideograph-numeric; /* 中英數之間自動留空（支援的瀏覽器） */
  accent-color: var(--accent);
}
body { font-size: var(--text-base); }
::selection { background: var(--accent-soft); color: var(--fg); }

/* ---------- 標題 ---------- */
h1, h2, h3, h4, .h1, .h2, .h3, .h4 {
  font-family: var(--font-display);
  line-height: var(--leading-tight);
  font-weight: 700;
  color: var(--fg);
  text-wrap: balance;
}
h1, .h1 { font-size: var(--text-3xl); }
h2, .h2 { font-size: var(--text-2xl); }
h3, .h3 { font-size: var(--text-xl); }
h4, .h4 { font-size: var(--text-lg); }
.display { font-size: var(--text-4xl); font-family: var(--font-display); line-height: 1.15; font-weight: 700; text-wrap: balance; }
.eyebrow { font-size: var(--text-sm); color: var(--meta); font-weight: 600; }

/* ---------- 內文與長文 ---------- */
p { max-width: 100%; }
.prose { max-width: var(--container-narrow); }
.prose > * + * { margin-top: var(--space-4); }
.prose > h2 { margin-top: var(--space-10); }
.prose > h3 { margin-top: var(--space-8); }
.prose > h2 + *, .prose > h3 + * { margin-top: var(--space-3); }
.prose ul, .prose ol { padding-left: 1.5em; }
.prose li + li { margin-top: var(--space-1); }
.prose blockquote { border-left: 3px solid var(--accent); padding-left: var(--space-4); color: var(--fg-2); }
.prose img { border-radius: var(--radius-md); }
small, .text-sm { font-size: var(--text-sm); }
.text-xs { font-size: var(--text-xs); }
.text-lg { font-size: var(--text-lg); }
.text-2 { color: var(--fg-2); }
.text-muted { color: var(--muted); }
.text-success { color: var(--success); }
.text-warn { color: var(--warn); }
.text-danger { color: var(--danger); }
.text-info { color: var(--info); }
.text-accent { color: var(--accent); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.mono, code, kbd, pre, samp { font-family: var(--font-mono); font-size: 0.925em; }
code { background: var(--surface-warm); padding: 0.1em 0.4em; border-radius: var(--radius-sm); }
pre { background: var(--surface-warm); padding: var(--space-4); border-radius: var(--radius-md); overflow: auto; line-height: 1.6; }
pre code { background: none; padding: 0; }
kbd { border: var(--border-width) solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-sm); padding: 0.05em 0.45em; background: var(--surface); }
strong, b { font-weight: 700; }
em { font-style: normal; font-weight: 600; }  /* 中文沒有斜體，強調改用粗一級 */
mark { background: var(--warn-soft); color: var(--fg); padding: 0 0.2em; }

/* ---------- 連結 ---------- */
a { color: var(--link); text-decoration: underline; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
nav a, header a, footer a, .btn { text-decoration: none; }  /* 底線只留給內文中的連結 */
a.quiet { text-decoration: none; color: inherit; }
a.quiet:hover { text-decoration: underline; }

/* ---------- 焦點：永遠看得見 ---------- */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid transparent;          /* 高對比（forced-colors）模式下仍有外框 */
  outline-offset: 2px;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-sm);
}
.skip-link {
  position: absolute; left: var(--space-4); top: -100px;
  background: var(--surface); color: var(--fg); padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md); box-shadow: var(--elev-overlay); z-index: 1000;
}
.skip-link:focus { top: var(--space-4); }

/* ---------- 版面工具 ---------- */
.container { width: 100%; max-width: var(--container-max); margin-inline: auto; padding-inline: var(--container-gutter-phone); }
.container--narrow { max-width: var(--container-narrow); }
.container--fluid { max-width: none; }
@media (min-width: 640px) { .container { padding-inline: var(--container-gutter-tablet); } }
@media (min-width: 1024px) { .container { padding-inline: var(--container-gutter-desktop); } }

.section { padding-block: var(--section-y-phone); }
@media (min-width: 640px) { .section { padding-block: var(--section-y-tablet); } }
@media (min-width: 1024px) { .section { padding-block: var(--section-y-desktop); } }

.stack-1 > * + * { margin-top: var(--space-1); }
.stack-2 > * + * { margin-top: var(--space-2); }
.stack-3 > * + * { margin-top: var(--space-3); }
.stack-4 > * + * { margin-top: var(--space-4); }
.stack-6 > * + * { margin-top: var(--space-6); }
.stack-8 > * + * { margin-top: var(--space-8); }
.stack-12 > * + * { margin-top: var(--space-12); }

.cluster { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }
.cluster--end { justify-content: flex-end; }
.cluster--between { justify-content: space-between; }
.cluster--tight { gap: var(--space-1) var(--space-2); }
.spacer { flex: 1; }

.grid { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 720px) {
  .grid--2 { grid-template-columns: repeat(2, 1fr); }
  .grid--3 { grid-template-columns: repeat(3, 1fr); }
  .grid--4 { grid-template-columns: repeat(2, 1fr); }
  .grid--sidebar { grid-template-columns: 280px 1fr; }
}
@media (min-width: 1024px) {
  .grid--4 { grid-template-columns: repeat(4, 1fr); }
}
.grid--gap-6 { gap: var(--space-6); }

.visually-hidden, .sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.hide-phone { display: none; }
@media (min-width: 720px) { .hide-phone { display: initial; } .hide-desktop { display: none; } }

/* ---------- 色票（預覽頁用） ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--space-2); }
.swatch { height: 64px; border-radius: var(--radius-md); box-shadow: var(--elev-ring); display: flex; align-items: flex-end; padding: var(--space-2); font-size: var(--text-xs); font-family: var(--font-mono); }
.chart-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--space-2); font-size: var(--text-sm); }
.chart-swatch { display: flex; align-items: center; gap: var(--space-1); }
.chart-swatch span { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
.chart-swatch i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; box-shadow: var(--elev-ring); }

/* ---------- 減少動效 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ---------- 列印 ---------- */
@media print {
  html { background: #fff; color: #000; font-size: 12pt; }
  .no-print, .theme-switcher { display: none !important; }
  a { color: inherit; text-decoration: none; }
  .card, .table { box-shadow: none !important; }
  .page-break { break-before: page; }
  h2, h3 { break-after: avoid; }
  tr, img, figure { break-inside: avoid; }
}
</style>
<style>
/* 【產生檔，不要手改】來源：共用設計系統的元件樣式
 * 複製日期：2026-10-28。要更新：由作者從設計系統重新複製。
 * 專案自己的樣式寫在 style.css，不要改這個檔。 */
/*
 * 共用設計系統共用元件。只用 token，不寫色碼；接上任何一套 02-設計系統/<套件>/tokens.css 都成立。
 * 命名：區塊 .btn、修飾 .btn--primary、子元素 .card__title、狀態 .is-active／.is-invalid／[disabled]／[aria-*]。
 * 每個互動元件都有 hover、focus-visible、active、disabled 四種狀態；按鈕另有 loading。
 * 說明文件在同資料夾的 .md 檔。
 */

/* ======================================================================
   1. 按鈕 .btn
   ====================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--control-h); padding: 0 var(--space-4);
  border: var(--border-width) solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg);
  font-weight: 600; font-size: var(--text-base); line-height: var(--leading-ui);
  text-decoration: none; white-space: nowrap; cursor: pointer; user-select: none;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast), color var(--motion-fast), box-shadow var(--motion-fast), transform var(--motion-fast);
}
.btn:hover { background: var(--surface-warm); border-color: var(--fg-2); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { box-shadow: var(--focus-ring); border-color: var(--link); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn[disabled]:hover { background: var(--surface); border-color: var(--border); }

.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-on); }
.btn--primary:active { background: var(--accent-active); border-color: var(--accent-active); }
.btn--primary[disabled]:hover { background: var(--accent); border-color: var(--accent); }

.btn--ghost { background: transparent; border-color: transparent; color: var(--link); }
.btn--ghost:hover { background: var(--accent-tint); border-color: transparent; color: var(--link); }

.btn--danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.btn--danger:hover { background: var(--danger); border-color: var(--danger); color: var(--danger-on); }
.btn--danger-solid { background: var(--danger); border-color: var(--danger); color: var(--danger-on); }
.btn--danger-solid:hover { background: var(--danger); filter: brightness(0.92); color: var(--danger-on); }

.btn--sm { min-height: calc(var(--control-h) - 8px); padding: 0 var(--space-3); font-size: var(--text-sm); }
.btn--lg { min-height: calc(var(--control-h) + 8px); padding: 0 var(--space-6); font-size: var(--text-lg); }
.btn--block { display: flex; width: 100%; }
.btn--icon { width: var(--control-h); padding: 0; }
.btn--pill { border-radius: var(--radius-pill); }
.btn.is-current, .btn[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--fg); }

.btn.is-loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.is-loading::after {
  content: ""; position: absolute; width: 1.1em; height: 1.1em; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  color: var(--accent-on); animation: spin 0.8s linear infinite;
}
.btn:not(.btn--primary).is-loading::after { color: var(--fg); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 按鈕群組：主要動作放最右 */
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; margin-left: calc(var(--border-width) * -1); }
.btn-group .btn:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }

/* ======================================================================
   2. 表單 .field / .input / .check / .switch
   ====================================================================== */
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field > label, .field > legend, .label { font-weight: 600; font-size: var(--text-sm); color: var(--fg); line-height: var(--leading-ui); }
.field > legend { padding: 0; margin-bottom: var(--space-1); }
fieldset.field { border: 0; padding: 0; margin: 0; }
.req { color: var(--danger); font-weight: 700; }
.optional { color: var(--muted); font-weight: 400; }
.help { font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-ui); }
.error { font-size: var(--text-sm); color: var(--danger); font-weight: 600; line-height: var(--leading-ui); }

.input {
  width: 100%; min-height: var(--control-h); padding: 0 var(--space-3);
  border: var(--border-width) solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--fg); line-height: var(--leading-ui);
  transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
}
.input::placeholder { color: var(--muted); }
.input:hover { border-color: var(--fg-2); }
.input:focus-visible { outline: none; border-color: var(--link); box-shadow: var(--focus-ring); }
.input[disabled], .input[readonly] { background: var(--surface-warm); color: var(--fg-2); cursor: not-allowed; }
.input[readonly] { cursor: default; }
textarea.input { min-height: calc(var(--control-h) * 2.5); padding: var(--space-2) var(--space-3); resize: vertical; line-height: var(--leading-body); }
select.input {
  appearance: none; padding-right: var(--space-8);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
}
.input--sm { min-height: calc(var(--control-h) - 8px); font-size: var(--text-sm); }
.input-group { display: flex; }
.input-group .input { border-radius: 0; }
.input-group > :first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.input-group > :last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.input-group .btn { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-left: calc(var(--border-width) * -1); }
.input-affix { display: flex; align-items: center; padding: 0 var(--space-3); border: var(--border-width) solid var(--border); background: var(--surface-warm); color: var(--fg-2); font-size: var(--text-sm); white-space: nowrap; }

.field.is-invalid .input, .input[aria-invalid="true"] { border-color: var(--danger); }
.field.is-invalid .input:focus-visible { box-shadow: 0 0 0 3px var(--danger-soft); border-color: var(--danger); }
.field.is-valid .input { border-color: var(--success); }

.check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); padding-right: var(--space-3); cursor: pointer; font-weight: 400; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.check input:focus-visible { box-shadow: var(--focus-ring); border-radius: 4px; }
.check input[disabled] + * { color: var(--muted); }
fieldset .check { margin-right: var(--space-3); }

.switch { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); cursor: pointer; position: relative; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch__track { width: 44px; height: 24px; border-radius: var(--radius-pill); background: var(--border); position: relative; transition: background var(--motion-fast); flex: none; box-shadow: inset 0 0 0 var(--border-width) var(--border); }
.switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform var(--motion-fast) var(--ease-standard); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .switch__track { background: var(--accent); box-shadow: none; }
.switch input:checked + .switch__track::after { transform: translateX(20px); background: var(--accent-on); }
.switch input:focus-visible + .switch__track { box-shadow: var(--focus-ring); }
.switch input[disabled] + .switch__track { opacity: 0.5; }

.form-row { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 720px) { .form-row--2 { grid-template-columns: 1fr 1fr; } .form-row--3 { grid-template-columns: 1fr 1fr 1fr; } }
.form-section { padding: var(--space-6); border: var(--border-width) solid var(--border-soft); border-radius: var(--radius-lg); background: var(--surface); }
.form-section > h2, .form-section > h3 { margin-bottom: var(--space-4); }
.form-actions { display: flex; gap: var(--space-3); justify-content: flex-end; flex-wrap: wrap; padding-top: var(--space-4); border-top: var(--border-width) solid var(--border-soft); }
.form-actions--sticky { position: sticky; bottom: 0; background: var(--bg); padding-bottom: var(--space-4); z-index: 5; }

/* ======================================================================
   3. 卡片 .card、統計 .stat、清單 .list
   ====================================================================== */
.card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--elev-raised); border: var(--border-width) solid var(--border-soft); }
.card--flat { box-shadow: none; }
.card--warm { background: var(--surface-warm); border-color: transparent; }
.card--accent { border-left: 4px solid var(--accent); }
.card--compact { padding: var(--space-4); }
.card__header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.card__title { font-size: var(--text-lg); font-weight: 700; }
.card__footer { margin-top: var(--space-4); padding-top: var(--space-4); border-top: var(--border-width) solid var(--border-soft); display: flex; gap: var(--space-3); justify-content: flex-end; }
a.card { display: block; color: inherit; text-decoration: none; transition: box-shadow var(--motion-fast), transform var(--motion-fast); }
a.card:hover { box-shadow: var(--elev-overlay); transform: translateY(-2px); }

.stat { display: flex; flex-direction: column; gap: var(--space-1); }
.stat__label { font-size: var(--text-sm); color: var(--fg-2); font-weight: 600; }
.stat__value { font-size: var(--text-3xl); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.stat__delta { font-size: var(--text-sm); font-weight: 600; }
.stat-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(2, 1fr); }
@media (min-width: 1024px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }

.list { list-style: none; padding: 0; margin: 0; }
.list__item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: var(--border-width) solid var(--border-soft); min-height: var(--tap-min); }
.list__item:last-child { border-bottom: 0; }
.list__body { flex: 1; min-width: 0; }
.list__title { font-weight: 600; }
.list__meta { font-size: var(--text-sm); color: var(--muted); }
a.list__item { color: inherit; text-decoration: none; }
a.list__item:hover { background: var(--accent-tint); margin-inline: calc(var(--space-3) * -1); padding-inline: var(--space-3); border-radius: var(--radius-sm); }

/* ======================================================================
   4. 徽章 .badge、標籤 .tag、頭像 .avatar、進度 .progress
   ====================================================================== */
.badge {
  display: inline-flex; align-items: center; gap: 0.3em; padding: 0.15em 0.6em; border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 700; line-height: 1.6; white-space: nowrap;
  background: var(--surface-warm); color: var(--fg-2); border: var(--border-width) solid var(--badge-border);
}
.badge--neutral { background: var(--surface-warm); color: var(--fg-2); border-color: var(--border-soft); }
.badge--accent { background: var(--accent-soft); color: var(--fg); }
.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warn { background: var(--warn-soft); color: var(--warn); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--info { background: var(--info-soft); color: var(--info); }
.badge--solid { background: var(--accent); color: var(--accent-on); }
.badge--outline { background: transparent; border-color: currentColor; }
.badge--dot::before { content: ""; width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; }
.badge--lg { font-size: var(--text-sm); padding: 0.25em 0.8em; }

.tag { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0.2em 0.6em; border-radius: var(--radius-sm); background: var(--surface-warm); border: var(--border-width) solid var(--border-soft); font-size: var(--text-sm); }
.tag__remove { border-radius: 50%; width: 1.4em; height: 1.4em; display: inline-grid; place-items: center; color: var(--fg-2); }
.tag__remove:hover { background: var(--danger-soft); color: var(--danger); }

.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--fg); display: inline-grid; place-items: center; font-weight: 700; font-size: var(--text-sm); flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--sm { width: 28px; height: 28px; font-size: var(--text-xs); }
.avatar--lg { width: 56px; height: 56px; font-size: var(--text-lg); }

.progress { height: 8px; background: var(--surface-warm); border-radius: var(--radius-pill); overflow: hidden; box-shadow: var(--elev-ring); }
.progress__bar { height: 100%; background: var(--accent); border-radius: var(--radius-pill); transition: width var(--motion-slow) var(--ease-standard); }
.progress--success .progress__bar { background: var(--success); }
.progress--warn .progress__bar { background: var(--warn); }
.progress--danger .progress__bar { background: var(--danger); }

/* ======================================================================
   5. 提示 .alert、通知 .toast
   ====================================================================== */
.alert {
  display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-1) var(--space-3); align-items: start;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  border: var(--border-width) solid var(--border-soft); border-left: 4px solid var(--fg-2);
  background: var(--surface-warm); color: var(--fg); line-height: var(--leading-ui);
}
.alert > strong { grid-column: 1; }
.alert > span { grid-column: 2; }
.alert > .alert__close { grid-column: 3; grid-row: 1; }
.alert--info { background: var(--info-soft); border-left-color: var(--info); }
.alert--info > strong { color: var(--info); }
.alert--success { background: var(--success-soft); border-left-color: var(--success); }
.alert--success > strong { color: var(--success); }
.alert--warn { background: var(--warn-soft); border-left-color: var(--warn); }
.alert--warn > strong { color: var(--warn); }
.alert--danger { background: var(--danger-soft); border-left-color: var(--danger); }
.alert--danger > strong { color: var(--danger); }
.alert__close { width: 28px; height: 28px; border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--fg-2); }
.alert__close:hover { background: var(--overlay); color: var(--surface); }

.toast-stack { position: fixed; right: var(--space-4); bottom: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); z-index: 900; max-width: min(380px, calc(100vw - var(--space-8))); }
.toast {
  display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  background: var(--fg); color: var(--bg); border-radius: var(--radius-md); box-shadow: var(--elev-overlay);
  animation: toast-in var(--motion-base) var(--ease-out);
}
.toast__icon { flex: none; font-weight: 700; }
.toast--success .toast__icon { color: var(--success-soft); }
.toast--danger .toast__icon { color: var(--danger-soft); }
.toast__body { flex: 1; font-size: var(--text-sm); line-height: var(--leading-ui); }
.toast__action { color: inherit; text-decoration: underline; font-weight: 700; font-size: var(--text-sm); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ======================================================================
   6. 表格 .table
   ====================================================================== */
.table-wrap { overflow-x: auto; border: var(--border-width) solid var(--border-soft); border-radius: var(--radius-md); background: var(--surface); }
.table { width: 100%; font-size: var(--text-sm); line-height: var(--leading-ui); }
.table th, .table td { padding: var(--space-3) var(--space-4); text-align: left; vertical-align: middle; border-bottom: var(--border-width) solid var(--border-soft); }
.table th { background: var(--surface-warm); color: var(--fg-2); font-weight: 700; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--accent-tint); }
.table tr.is-selected { background: var(--accent-soft); }
.table tr.is-selected:hover { background: var(--accent-soft); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table .actions { text-align: right; white-space: nowrap; }
.table--compact th, .table--compact td { padding: var(--space-2) var(--space-3); }
.table--zebra tbody tr:nth-child(even) { background: var(--surface-warm); }
.table th.is-sorted { color: var(--fg); }
.table th button { font: inherit; color: inherit; display: inline-flex; gap: 0.3em; align-items: center; }
.table .row-check { width: 1%; }
.table caption { text-align: left; padding: var(--space-3) var(--space-4); font-weight: 700; color: var(--fg); caption-side: top; }

/* 手機：表格轉為卡片列（data-label 由 HTML 提供） */
@media (max-width: 600px) {
  .table--responsive thead { display: none; }
  .table--responsive tr { display: block; padding: var(--space-3) var(--space-4); border-bottom: var(--border-width) solid var(--border-soft); }
  .table--responsive td { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-1) 0; border: 0; text-align: right; }
  .table--responsive td::before { content: attr(data-label); color: var(--fg-2); font-weight: 600; text-align: left; }
  .table--responsive td.actions { justify-content: flex-end; }
  .table--responsive td.actions::before { content: none; }
}

.pagination { display: flex; gap: var(--space-1); align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.pagination__info { margin-right: auto; font-size: var(--text-sm); color: var(--fg-2); }

/* 工具列（篩選、搜尋、批次操作） */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }
.toolbar .input { width: auto; min-width: 160px; }
.searchbox { position: relative; }
.searchbox .input { padding-left: var(--space-8); }
.searchbox__icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

/* ======================================================================
   7. 導覽：頂欄 .topbar、側欄 .sidebar、頁籤 .tabs、麵包屑 .breadcrumb、底部導覽 .bottom-nav
   ====================================================================== */
.topbar {
  display: flex; align-items: center; gap: var(--space-4); min-height: 56px; padding: 0 var(--space-4);
  background: var(--surface); border-bottom: var(--border-width) solid var(--border-soft); position: sticky; top: 0; z-index: 50;
}
.topbar__title { font-weight: 700; font-size: var(--text-lg); display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); }
.topbar__actions { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
.topbar__brand { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-on); display: grid; place-items: center; font-weight: 800; font-size: var(--text-sm); }

.app-shell { display: grid; min-height: 100dvh; grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
@media (min-width: 1024px) { .app-shell { grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: auto 1fr; } .app-shell .topbar { grid-column: 2; grid-row: 1; } .app-shell .main { grid-column: 2; grid-row: 2; } }
.sidebar { background: var(--surface-warm); border-right: var(--border-width) solid var(--border-soft); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
@media (min-width: 1024px) { .sidebar { position: sticky; top: 0; height: 100dvh; overflow-y: auto; grid-column: 1; grid-row: 1 / span 2; } }
.sidebar__brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-4); border-bottom: var(--border-width) solid var(--border-soft); font-weight: 700; font-family: var(--font-display); font-size: var(--text-lg); }
.sidebar__group { font-size: var(--text-xs); font-weight: 700; color: var(--muted); padding: var(--space-3) var(--space-3) var(--space-1); text-transform: none; }
.sidebar__nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar__link {
  display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-min); padding: 0 var(--space-3);
  border-radius: var(--radius-md); color: var(--fg); text-decoration: none; font-weight: 500;
}
.sidebar__link:hover { background: var(--accent-tint); }
.sidebar__link.is-active, .sidebar__link[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.sidebar__link .badge { margin-left: auto; }
.sidebar__icon { width: 20px; text-align: center; color: var(--fg-2); flex: none; }
.sidebar__link.is-active .sidebar__icon { color: var(--accent); }
.sidebar__footer { margin-top: auto; padding-top: var(--space-4); border-top: var(--border-width) solid var(--border-soft); }
.main { padding: var(--space-6) var(--container-gutter-phone); min-width: 0; }
@media (min-width: 640px) { .main { padding: var(--space-6) var(--container-gutter-tablet); } }
@media (min-width: 1024px) { .main { padding: var(--space-8) var(--container-gutter-desktop); } }

.page-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-6); }
.page-header h1 { font-size: var(--text-2xl); }
.page-header__sub { color: var(--fg-2); margin-top: var(--space-1); }

.breadcrumb { display: flex; flex-wrap: wrap; gap: var(--space-1); font-size: var(--text-sm); color: var(--fg-2); list-style: none; padding: 0; }
.breadcrumb li + li::before { content: "／"; color: var(--muted); margin: 0 var(--space-1); }
.breadcrumb a { color: var(--fg-2); text-decoration: none; }
.breadcrumb a:hover { color: var(--link); text-decoration: underline; }
.breadcrumb [aria-current="page"] { color: var(--fg); font-weight: 600; }

.tabs { display: flex; gap: var(--space-1); border-bottom: var(--border-width) solid var(--border-soft); overflow-x: auto; }
.tab { padding: var(--space-3) var(--space-4); min-height: var(--tap-min); color: var(--fg-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; text-decoration: none; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.tab:hover { color: var(--fg); background: var(--accent-tint); }
.tab.is-active, .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-panel[hidden] { display: none; }

.segmented { display: inline-flex; background: var(--surface-warm); padding: 3px; border-radius: var(--radius-md); gap: 2px; }

.segmented > button { min-height: var(--tap-min); min-width: var(--tap-min); }
.segmented > button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 700; box-shadow: inset 0 0 0 2px var(--accent); }
.segmented > button:focus-visible { box-shadow: var(--focus-ring); }
.segmented > button[aria-pressed="true"]:focus-visible { box-shadow: inset 0 0 0 2px var(--accent), var(--focus-ring); }
.segmented > button .ico { display: block; margin: 0 auto; }

/* 分類式選擇器：上排大類、下面線條 */
.picker .cats { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
.picker .cats button {
  min-height: var(--tap-min); padding: 0 var(--space-3); border-radius: var(--radius-pill);
  border: var(--border-width) solid var(--border); background: var(--surface);
  font-size: var(--text-sm); font-weight: 600; color: var(--fg-2);
}
.picker .cats button:hover { background: var(--accent-tint); }
.picker .cats button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.picker .items { display: flex; flex-direction: column; gap: var(--space-1); }
.picker .items button {
  display: flex; align-items: center; gap: var(--space-2); text-align: left;
  min-height: var(--tap-min); padding: var(--space-1) var(--space-2);
  border: var(--border-width) solid transparent; border-radius: var(--radius-sm);
  font-size: var(--text-sm); color: var(--fg);
}
.picker .items button:hover { background: var(--accent-tint); }
.picker .items button.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.picker .items button svg { flex: none; }
.dialog .picker .items { display: grid; grid-template-columns: 1fr 1fr; }
.curtype { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); margin: var(--space-1) 0; }

/* 線條與符號的縮圖是「紙上的樣子」（深色線條），深色模式下要襯白底才看得見 */
.picker .items button > svg, .curtype > svg, .typebtn > svg:not(.ico), .legend > div > svg, .legend > div > span > svg,
.symprev > svg {
  background: var(--paper); border-radius: var(--radius-sm); padding: 2px;
}

/* ── 對話框 ──
   base.css 的 `* { margin: 0 }` 會蓋掉瀏覽器給 <dialog> 的 margin:auto，對話框會黏在左上角。 */
dialog.dialog { margin: auto; }
/* 內容長時只捲本文，標題與「關閉」固定看得到（審查 2026-10-28 M2：原本整個對話框一起捲，頁尾捲走） */
dialog.dialog[open] { display: flex; flex-direction: column; overflow: hidden; }
.dialog__header, .dialog__footer { flex: none; }
.dialog__footer { padding-top: var(--space-3); border-top: var(--border-width) solid var(--border-soft); }
.dialog__body { overflow-y: auto; min-height: 0; flex: 1 1 auto; }

/* ── 對話框內容：圖例與使用說明 ── */
.legend { display: grid; grid-template-columns: 72px 1fr; gap: var(--space-2) var(--space-3); align-items: center; }
.legend > div:nth-child(odd) { display: grid; place-items: center; }
.legend .desc { font-size: var(--text-sm); color: var(--fg-2); line-height: var(--leading-ui); }
.lh { margin: var(--space-4) 0 var(--space-2); color: var(--accent); font-size: var(--text-base); }

.help-doc h3 { margin: var(--space-4) 0 var(--space-2); color: var(--accent); font-size: var(--text-lg); }
.help-doc h3:first-child { margin-top: 0; }
.help-doc p { margin-bottom: var(--space-2); }
.help-doc ul, .help-doc ol { margin: 0 0 var(--space-3); padding-left: 1.5em; }
/* 生活圈成員清單：每人一列，右邊「移出」 */
.members { list-style: none; padding: 0; margin: 0 0 var(--space-2); display: grid; gap: var(--space-1); }
.members li { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.members li > span { font-weight: 600; overflow-wrap: anywhere; }
/* 提示裡的按鈕（例：拖進生活圈後的「加入」）：觸控目標至少 44px */
.toast__action { min-height: 44px; min-width: 44px; padding: 0 var(--space-2); align-self: center; border-radius: var(--radius-sm); }
.toast__action:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }
.toast--warn .toast__icon { color: var(--warn-soft); }
.help-doc li + li { margin-top: var(--space-1); }
.help-doc .tip {
  background: var(--warn-soft); border: var(--border-width) solid var(--warn);
  border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin: var(--space-3) 0;
}

/* 管理欄位 */
.fieldrow { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--space-2); align-items: center; }
.fieldrow .check { padding-right: 0; margin-right: 0; min-width: var(--tap-min); justify-content: center; }
.field__error { color: var(--danger); font-size: var(--text-sm); margin-top: var(--space-1); }
.fieldrow + .fieldrow { margin-top: var(--space-2); }
.fieldrow .n { font-size: var(--text-sm); color: var(--muted); white-space: nowrap; }
.fieldrow .ops { display: flex; gap: var(--space-1); }

/* 「作者：王錫凡」接在「使用說明」旁邊（使用者 2026-10-28）：字小一點、顏色淡一點，不搶主要動作 */
.topbar__author { font-size: var(--text-sm); color: var(--fg-2); font-weight: 600; }
@media (max-width: 1024px) { .topbar__author { padding-inline: var(--space-2); } }
/* 作者資訊視窗：欄位清單＋最後一段 CRPD 宣言 */
.dl.about { margin-bottom: var(--space-4); }
.crpd { margin: 0 0 var(--space-3); padding: var(--space-3) var(--space-4); background: var(--accent-soft); color: var(--fg); border-radius: var(--radius-md); }
.crpd p { margin: var(--space-1) 0 0; font-weight: 600; line-height: var(--leading-body); }

/* 上列與畫布工具列在畫面頂端：說明往下出現，才不會被視窗或上列裁掉（審查 2026-10-28 L4） */
.topbar .tooltip::after, .stage__toolbar .tooltip::after { bottom: auto; top: calc(100% + 6px); }

/* ── 視窗變窄 ── */
@media (max-width: 1280px) {
  :root { --sidebar-w: 236px; --props-w: 300px; }
}
@media (max-width: 1024px) {
  .workspace { grid-template-columns: 220px minmax(0, 1fr) 280px; }
  .topbar__title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
</style>

<a class="skip-link" href="#canvas">跳到畫布</a>

<header class="topbar">

    <button id="btnSaveAs" class="btn">另存新檔…</button>

      <ul class="menu__list" id="exportMenu" hidden>
        <li><button class="menu__item" id="btnCopy">複製圖片（貼進 Word）</button></li>
        <li><button class="menu__item" id="btnPng">匯出 PNG 圖檔</button></li>

    <button id="btnHelp" class="btn btn--ghost">使用說明</button>
    <button id="btnAbout" class="btn btn--ghost topbar__author" aria-label="作者資訊：王錫凡、版本、授權、聯絡方式與 CRPD 宣言">作者：王錫凡</button>
  </nav>
</header>

<main class="workspace">
  <aside class="sidebar" id="tools" aria-label="工具">
    <section class="toolgroup">
      <h2 class="sidebar__group">新增人物</h2>
      <div class="grid3">
        <button class="addbtn" data-add="M" title="新增男性"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="4" y="4" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/></svg>男</button>
        <button class="addbtn" data-add="F" title="新增女性"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>女</button>
        <button class="addbtn" data-add="U" title="新增未知性別"><svg viewBox="0 0 26 26" aria-hidden="true"><text x="13" y="21" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">?</text></svg>未知</button>
      </div>
    </section>

    <section class="toolgroup">
      <h2 class="sidebar__group">家庭關係</h2>
      <div class="grid2">
        <button class="btn" data-kin="partner" data-plus><span class="sr-only">新增</span>伴侶</button>
        <button class="btn" data-kin="parents" data-plus><span class="sr-only">新增</span>父母</button>
        <button class="btn" data-kin="son" data-plus><span class="sr-only">新增</span>兒子</button>
        <button class="btn" data-kin="daughter" data-plus><span class="sr-only">新增</span>女兒</button>
        <button class="btn" data-kin="brother" data-plus><span class="sr-only">新增</span>兄弟</button>
        <button class="btn" data-kin="sister" data-plus><span class="sr-only">新增</span>姊妹</button>
      </div>
      <div class="stack-2 toolgroup__rows">
        <button class="btn btn--block" data-kin="linkPartner">連結為伴侶…</button>
        <button class="btn btn--block" data-kin="attachChild">設為某段關係的子女…</button>
        <button id="btnLayout" class="btn btn--block">自動排版…</button>

      <p class="help" id="kinHint">先在畫布上點選一個人。</p>
    </section>

    <section class="toolgroup">

      <button id="relTypeBtn" class="typebtn"></button>
      <div class="stack-2 toolgroup__rows">
        <button id="btnRelation" class="btn btn--block">從選取的人拉線…</button>
        <button id="btnLegend" class="btn btn--ghost btn--block">看圖例說明</button>
      </div>

    <section class="toolgroup">

      <div class="stack-2">
        <button id="btnHousehold" class="btn btn--block" title="先選取同住的人（按住 Shift 可多選）">圈成生活圈（同住）</button>
        <button id="btnLabel" class="btn btn--block">新增文字說明</button>
      </div>

      </div>

    </section>

    <section class="toolgroup">
      <h2 class="sidebar__group">顯示設定</h2>

  </aside>

  <section class="stage" id="stage">

    </div></div>

    <div class="stage__toolbar toolbar" role="toolbar" aria-label="編輯">
      <button id="btnUndo" class="btn btn--icon tooltip" data-tip="復原（Ctrl+Z）" aria-label="復原"></button>

      <button id="btnDelete" class="btn btn--icon btn--danger tooltip" data-tip="刪除選取的項目（Delete）" aria-label="刪除選取的項目"></button>
    </div>

</main>

<script>

  const CHILD_LINKS = [

  // 接受：1965、1965-03、1965-03-08、1965/3/8、民國54年3月8日、民54、54/3/8（年份 < 1000 視為民國）
  function parseDate(input) {
    if (input == null) return null;
    let s = String(input).trim();
    if (!s) return null;
    let roc = false;
    if (/^民國?/.test(s)) { roc = true; s = s.replace(/^民國?/, ''); }
    s = s.replace(/[年月]/g, '-').replace(/日/g, '').replace(/[./]/g, '-').replace(/-+$/, '');
    const m = s.match(/^(\d{1,4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/);
    if (!m) return null;
    let y = +m[1];
    const mo = m[2] ? +m[2] : null;
    const d = m[3] ? +m[3] : null;
    if (roc || y < 1000) y += 1911;
    if (mo !== null && (mo < 1 || mo > 12)) return null;
    if (d !== null && (d < 1 || d > 31)) return null;
    return { y, m: mo, d };
  }

  function formatDate(pd) {
    if (!pd) return '';
    const p = (n) => String(n).padStart(2, '0');
    if (pd.m == null) return String(pd.y);

    return `${pd.y}-${p(pd.m)}-${p(pd.d)}`;

    let n = b.y - a.y;

    if (!approx) {
      const ad = a.d == null ? 1 : a.d;
      const bd = b.d == null ? 1 : b.d;
      if (b.m < a.m || (b.m === a.m && bd < ad)) n -= 1;

    return { n, approx: approx || a.d == null || b.d == null };

        if (r.n >= 0) return { value: r.n, source: 'birth', approx: r.approx };

    if (birth) {

      if (r.n >= 0) return { value: r.n, source: 'birth', approx: r.approx };

  function charEm(ch) {

    if (c >= 0x2E80 && c <= 0x9FFF) return 1;       // 中日韓文字與符號
    if (c >= 0xAC00 && c <= 0xD7AF) return 1;       // 韓文
    if (c >= 0xFF00 && c <= 0xFFEF) return 1;       // 全形
    return ch === ' ' ? 0.3 : 0.58;
  }
  const textEm = (s) => Array.from(String(s)).reduce((a, ch) => a + charEm(ch), 0);

  function wrapText(s, maxEm) {
    const out = [];
    for (const para of String(s).split(/\r?\n/)) {
      const toks = [];                                   // 連續的半形字（英文、數字、標點）＝一個單字
      for (const ch of Array.from(para)) {
        const word = ch !== ' ' && charEm(ch) < 1, last = toks[toks.length - 1];
        if (word && last && last.word) last.text += ch; else toks.push({ text: ch, word });
      }
      let line = '', w = 0, wrapped = false;
      const brk = () => { out.push(line.replace(/ +$/, '')); line = ''; w = 0; wrapped = true; };
      for (const t of toks) {
        const tw = textEm(t.text);
        if (w + tw > maxEm && line) brk();
        if (t.text === ' ' && wrapped && !line) continue; // 斷行處的空白不帶到下一行開頭
        if (tw <= maxEm) { line += t.text; w += tw; continue; }
        for (const ch of Array.from(t.text)) {             // 單字比一整行還長：只好從字中間斷
          const cw = charEm(ch);
          if (w + cw > maxEm && line) brk();
          line += ch; w += cw;
        }
      }
      out.push(line);
    }
    return out;
  }

  const LABEL_WRAP_EM = 8;  // 人物下方標籤每行最多約 8 個中文字寬

  // 人物下方要顯示的文字（每個元素＝一行；kind='name' 給畫圖層套粗體）
  function labelLines(doc, p) {
    const lines = [];
    const push = (text, kind) => wrapText(text, LABEL_WRAP_EM).forEach(t => { if (t) lines.push({ text: t, kind }); });
    if (p.name && p.name.trim()) push(p.name.trim(), 'name');
    const st = doc.settings;
    if (st.showYears) {
      const b = parseDate(p.birth), d = parseDate(p.death);
      if (b || (p.deceased && d)) push(`${b ? b.y : '?'}–${p.deceased ? (d ? d.y : '?') : ''}`, 'attr');
    }
    for (const f of st.fields) {
      if (!f.show) continue;
      const v = (p.attrs && p.attrs[f.key] != null) ? String(p.attrs[f.key]).trim() : '';
      if (!v) continue;
      push(st.labelMode === 'labelled' ? `${f.label}：${v}` : v, 'attr');
    }
    return lines;
  }

  // 欄位輸入提示：預設提示 ∪ 本檔已出現過的值（模式 9）
  function suggestionsFor(doc, key) {
    const base = (DEFAULT_FIELDS.find(f => f.key === key) || { suggest: [] }).suggest;
    const used = Object.values(doc.persons).map(p => (p.attrs || {})[key]).filter(v => v && String(v).trim());
    return Array.from(new Set([...base, ...used.map(v => String(v).trim())]));
  }

  // ── 欄位管理 ──
  function addField(doc, label) {
    const name = String(label || '').trim().slice(0, 20);
    if (!name || doc.settings.fields.some(f => f.label === name)) return null;
    let key;
    do { key = newId(doc, 'f'); } while (doc.settings.fields.some(f => f.key === key));
    doc.settings.fields.push({ key, label: name, show: true });
    return key;
  }
  function renameField(doc, key, label) {
    const f = doc.settings.fields.find(x => x.key === key);
    const name = String(label || '').trim().slice(0, 20);
    if (!f || !name || doc.settings.fields.some(x => x.key !== key && x.label === name)) return false;
    f.label = name;          // 只改顯示名，資料鍵不動
    return true;
  }
  function fieldUsage(doc, key) {
    return Object.values(doc.persons).filter(p => p.attrs && String(p.attrs[key] || '').trim()).length;
  }
  function removeField(doc, key) {
    const i = doc.settings.fields.findIndex(f => f.key === key);
    if (i < 0) return false;
    doc.settings.fields.splice(i, 1);
    for (const p of Object.values(doc.persons)) if (p.attrs) delete p.attrs[key];
    return true;
  }
  function moveField(doc, key, delta) {
    const a = doc.settings.fields, i = a.findIndex(f => f.key === key), j = i + delta;
    if (i < 0 || j < 0 || j >= a.length) return false;
    [a[i], a[j]] = [a[j], a[i]];
    return true;
  }

  // ── 查詢 ──
  const unionsOf = (doc, pid) => Object.values(doc.unions).filter(u => u.partners.includes(pid));
  const parentUnionOf = (doc, pid) => Object.values(doc.unions).find(u => u.children.some(c => c.id === pid)) || null;
  function unionBetween(doc, a, b) {
    return Object.values(doc.unions).find(u => u.partners.length === 2 && u.partners.includes(a) && u.partners.includes(b)) || null;
  }
  function occupied(doc, x, y) {
    return Object.values(doc.persons).some(p => Math.abs(p.x - x) < S * 1.5 && Math.abs(p.y - y) < S * 1.5);
  }
  function freeSpot(doc, x, y, dir) {
    let nx = snap(x);
    for (let i = 0; i < 60 && occupied(doc, nx, snap(y)); i++) nx += (dir || 1) * GAP_X / 2;
    return nx;
  }

  // ── 編輯指令（呼叫前由介面層先存復原點）──
  function blankPerson(id, gender, x, y) {
    return { id, gender, x: snap(x), y: snap(y), name: '', index: false, deceased: false,
             age: '', birth: '', death: '', deathAge: '', attrs: {},
             life: '', culture: '', illness: '', substance: '', conditions: [] };
  }

  function addPerson(doc, opts) {
    const o = opts || {};
    const x = o.x || 0, y = o.y || 0;
    const id = newId(doc, 'p');
    const p = blankPerson(id, has(GENDERS, o.gender) ? o.gender : 'U', freeSpot(doc, x, y), y);
    p.name = String(o.name || '').slice(0, 60);
    doc.persons[id] = p;
    return id;
  }

  function linkPartners(doc, a, b, type) {
    if (a === b || !doc.persons[a] || !doc.persons[b]) return null;
    const ex = unionBetween(doc, a, b);
    if (ex) return ex.id;
    const id = newId(doc, 'u');
    const [l, r] = doc.persons[a].x <= doc.persons[b].x ? [a, b] : [b, a];
    doc.unions[id] = { id, partners: [l, r], type: has(FAMILY_TYPES, type) ? type : 'Marriage', children: [], twins: [], note: '' };
    return id;
  }

  function addPartner(doc, pid) {
    const p = doc.persons[pid];
    if (!p) return null;
    const g = p.gender === 'M' ? 'F' : p.gender === 'F' ? 'M' : 'U';
    // 右邊已經有伴侶 → 新伴侶放左邊（「前任—本人—現任」的標準排法，兩條伴侶線才不會疊在一起）
    const others = unionsOf(doc, pid).map(u => u.partners.find(x => x !== pid)).filter(x => x && doc.persons[x]);
    const rightTaken = others.some(x => doc.persons[x].x > p.x), leftTaken = others.some(x => doc.persons[x].x < p.x);
    let dir = rightTaken && !leftTaken ? -1 : 1;
    // 旁邊的位置被別人（例如手足）佔住、另一側是空的 → 放另一側，伴侶線才不會從別人底下穿過
    const slot = (d) => snap(p.x + d * GAP_X);
    const otherSideFree = dir === 1 ? !leftTaken : !rightTaken;
    if (occupied(doc, slot(dir), p.y) && !occupied(doc, slot(-dir), p.y) && otherSideFree) dir = -dir;
    // 兩邊都被佔住：把這一側的人往外推，新伴侶貼在本人旁邊（使用者 2026-10-28：原本會被擠到整排最後面，
    // 伴侶線從手足底下穿過）。本人兩邊都已經有伴侶時照舊往外找空位，不推
    const moved = rightTaken && leftTaken ? 0 : makeRoom(doc, p, dir, slot(dir));
    const nid = newId(doc, 'p');
    doc.persons[nid] = blankPerson(nid, g, freeSpot(doc, p.x + dir * GAP_X, p.y, dir), p.y);
    return { personId: nid, unionId: linkPartners(doc, pid, nid), moved };
  }
  // 讓位：x 這個位置被佔住時，把本人 dir 那一側同一列的人往外推，讓新伴侶跟下一個人至少隔 0.8 個 GAP_X。
  // 被推的人的伴侶與子孫（含子孫的伴侶）一起移，家庭才不會被拆開。回傳移動了幾個人
  function makeRoom(doc, p, dir, x) {
    if (!occupied(doc, x, p.y)) return 0;
    const row = Object.values(doc.persons).filter(q => q !== p && Math.abs(q.y - p.y) < S * 1.5 && (q.x - p.x) * dir > 0);
    if (!row.length) return 0;
    const nearest = row.reduce((a, q) => (Math.abs(q.x - p.x) < Math.abs(a.x - p.x) ? q : a));
    const shift = snap(Math.max(0, (x + dir * GAP_X * 0.8 - nearest.x) * dir));
    if (!shift) return 0;
    const move = new Set(row.map(q => q.id));
    for (let grew = true; grew;) {
      grew = false;
      for (const u of Object.values(doc.unions)) {
        if (!u.partners.some(id => move.has(id))) continue;
        const add = u.children.map(c => c.id).concat(u.partners.filter(id => doc.persons[id] && doc.persons[id].y > p.y + S));
        for (const id of add) if (id !== p.id && doc.persons[id] && !move.has(id)) { move.add(id); grew = true; }
      }
    }
    for (const id of move) doc.persons[id].x += dir * shift;
    return move.size;
  }

  function addChild(doc, unionId, gender) {
    const u = doc.unions[unionId];
    if (!u) return null;
    const ps = u.partners.map(id => doc.persons[id]).filter(Boolean);
    if (!ps.length) return null;
    const baseY = Math.max(...ps.map(p => p.y)) + GAP_Y;
    const kids = u.children.map(c => doc.persons[c.id]).filter(Boolean);
    const midX = ps.reduce((a, p) => a + p.x, 0) / ps.length;
    const x = kids.length ? Math.max(...kids.map(k => k.x)) + GAP_X * 0.8 : midX;
    const id = newId(doc, 'p');
    doc.persons[id] = blankPerson(id, has(GENDERS, gender) ? gender : 'U', freeSpot(doc, x, baseY, 1), baseY);
    u.children.push({ id, link: 'bio' });
    return id;
  }

  // 對「人」加子女：只有一段關係＝加在那段；沒有＝建單親家庭；多段＝回傳 needUnion 讓介面請使用者先點關係線
  function addChildToPerson(doc, pid, gender) {
    if (!doc.persons[pid]) return null;
    const us = unionsOf(doc, pid);
    if (us.length > 1) return { needUnion: true };
    let uid = us.length ? us[0].id : null;
    if (!uid) {
      uid = newId(doc, 'u');
      doc.unions[uid] = { id: uid, partners: [pid], type: 'Other', children: [], twins: [], note: '' };
    }
    return { personId: addChild(doc, uid, gender), unionId: uid };
  }

  function addParents(doc, pid) {
    const c = doc.persons[pid];
    if (!c) return null;
    if (parentUnionOf(doc, pid)) return { exists: true };
    const y = c.y - GAP_Y;
    const fid = newId(doc, 'p');
    doc.persons[fid] = blankPerson(fid, 'M', freeSpot(doc, c.x - GAP_X / 2, y, -1), y);
    const mid = newId(doc, 'p');
    doc.persons[mid] = blankPerson(mid, 'F', freeSpot(doc, doc.persons[fid].x + GAP_X, y, 1), y);
    const uid = linkPartners(doc, fid, mid);
    doc.unions[uid].children.push({ id: pid, link: 'bio' });
    return { fatherId: fid, motherId: mid, unionId: uid };
  }

  function addSibling(doc, pid, gender) {
    const u = parentUnionOf(doc, pid);
    if (!u) return { needParents: true };
    return { personId: addChild(doc, u.id, gender), unionId: u.id };
  }

  // 把某人加為某段關係的子女（例：先各自畫好再連起來）
  function attachChild(doc, unionId, pid) {
    const u = doc.unions[unionId];
    if (!u || !doc.persons[pid] || u.partners.includes(pid)) return false;
    const cur = parentUnionOf(doc, pid);
    if (cur) { cur.children = cur.children.filter(c => c.id !== pid); pruneTwins(cur); }
    u.children.push({ id: pid, link: 'bio' });
    return true;
  }

  // ── 雙胞胎：同一段關係底下的子女才能設為雙胞胎；一個人只屬於一組；少於 2 人的組自動拿掉 ──
  function pruneTwins(u) {
    const kids = new Set(u.children.map(c => c.id));
    u.twins = (u.twins || []).map(t => ({ ids: t.ids.filter(id => kids.has(id)), kind: t.kind }))
                             .filter(t => t.ids.length >= 2);
  }
  // 選到的人是不是同一段關係的子女（設雙胞胎前檢查用）；是的話回傳那段關係
  function commonParentUnion(doc, ids) {
    const us = ids.map(id => parentUnionOf(doc, id));
    return us.length >= 2 && us[0] && us.every(u => u === us[0]) ? us[0] : null;
  }
  function setTwins(doc, unionId, ids, kind) {
    const u = doc.unions[unionId];
    if (!u) return false;
    const kids = new Set(u.children.map(c => c.id));
    const group = Array.from(new Set(ids)).filter(id => kids.has(id));
    if (group.length < 2) return false;
    u.twins = (u.twins || []).map(t => ({ ids: t.ids.filter(id => !group.includes(id)), kind: t.kind }));
    u.twins.push({ ids: group, kind: has(TWIN_KINDS, kind) ? kind : 'Fraternal' });
    pruneTwins(u);
    return true;
  }
  function twinGroupOf(doc, pid) {
    for (const u of Object.values(doc.unions)) {
      const g = (u.twins || []).find(t => t.ids.includes(pid));
      if (g) return { union: u, group: g };
    }
    return null;
  }
  function clearTwin(doc, pid) {
    const hit = twinGroupOf(doc, pid);
    if (!hit) return false;
    hit.union.twins = hit.union.twins.map(t => ({ ids: t.ids.filter(id => id !== pid), kind: t.kind }));
    pruneTwins(hit.union);
    return true;
  }

  function addRelation(doc, a, b, type) {
    if (a === b || !doc.persons[a] || !doc.persons[b]) return null;
    const id = newId(doc, 'r');
    doc.relations[id] = { id, a, b, type: has(EMOTION_TYPES, type) ? type : 'Plain', note: '' };
    return id;
  }

  // ── 生活圈：一個人只住在一個生活圈（使用者 2026-10-28）──
  // 同住是遞移的：A 跟 B 同住、A、B、C 又同住＝就是 A、B、C 同住，圖上只畫一個圈。所有改生活圈的指令都守這條。
  const householdOf = (doc, pid) => Object.values(doc.households).find(h => h.members.includes(pid)) || null;
  // 把 from 併進 into：成員合在一起；連到 from 的生態連結改連 into（兩端變成同一個圈的線拿掉）；into 沒名稱就沿用 from 的
  function absorbHousehold(doc, into, from) {
    const a = doc.households[into], b = doc.households[from];
    if (!a || !b || a === b) return;
    for (const m of b.members) if (!a.members.includes(m)) a.members.push(m);
    if (!a.label && b.label) a.label = b.label;
    for (const t of Object.values(doc.ties)) {
      if (t.a === from) t.a = into;
      if (t.b === from) t.b = into;
      if (t.a === t.b) delete doc.ties[t.id];
    }
    delete doc.households[from];
  }
  // 圈成生活圈。選到的人已經在別的生活圈時：
  //   mode 'merge'＝合併：選到的人＋他們原本生活圈的所有人變成一個圈，保留最早那個圈（名稱與生態連結都留著）
  //   其他（預設）＝只圈選到的人：他們從原本的生活圈移出（原本的圈沒人了就一起刪）
  function addHousehold(doc, members, label, mode) {
    const ms = Array.from(new Set(members)).filter(id => doc.persons[id]);
    if (!ms.length) return null;
    const order = Object.keys(doc.households);
    const old = Array.from(new Set(ms.map(m => householdOf(doc, m)).filter(Boolean)))
      .sort((x, y) => order.indexOf(x.id) - order.indexOf(y.id));
    if (mode === 'merge' && old.length) {
      const keep = old[0].id;
      old.slice(1).forEach(h => absorbHousehold(doc, keep, h.id));
      const h = doc.households[keep];
      for (const m of ms) if (!h.members.includes(m)) h.members.push(m);
      if (!h.label && label) h.label = String(label).slice(0, 30);
      return keep;
    }
    for (const m of ms) { const h = householdOf(doc, m); if (h) leaveHousehold(doc, h.id, m); }
    const id = newId(doc, 'h');
    doc.households[id] = { id, members: ms, label: String(label || '').slice(0, 30) };
    return id;
  }
  // 加入生活圈（使用者 2026-10-28：在圖上把人拖進圈裡就能加入）；本來在別的生活圈的人＝搬過來（從原本的圈移出）。
  // 回傳實際加入的人數
  function joinHousehold(doc, hid, ids) {
    const h = doc.households[hid];
    if (!h) return 0;
    const add = Array.from(new Set(ids)).filter(id => doc.persons[id] && !h.members.includes(id));
    for (const m of add) { const o = householdOf(doc, m); if (o) leaveHousehold(doc, o.id, m); }
    h.members.push(...add);
    return add.length;
  }
  // 移出最後一位成員＝整個生活圈一起刪（連到它的生態連結也一起刪）
  function leaveHousehold(doc, hid, pid) {
    const h = doc.households[hid];
    if (!h || !h.members.includes(pid)) return false;
    h.members = h.members.filter(m => m !== pid);
    if (!h.members.length) deleteItems(doc, [hid]);
    return true;
  }

  function addLabel(doc, x, y, text) {
    const id = newId(doc, 't');
    doc.labels[id] = { id, x: snap(x), y: snap(y), text: String(text == null ? '文字說明' : text).slice(0, 1000) };
    return id;
  }

  // 生態圖：外部系統（畫成圓，名稱寫在圓裡）
  function addSystem(doc, o) {
    const id = newId(doc, 's');
    doc.systems[id] = { id, name: str(o && o.name, 30), x: snap((o && o.x) || 0), y: snap((o && o.y) || 0) };
    return id;
  }
  // 生態連結：兩端可以是人、外部系統、或生活圈（＝整個家庭）；同一端不能連自己
  const tieEndExists = (doc, id) => !!(doc.persons[id] || doc.systems[id] || doc.households[id]);
  function addTie(doc, a, b, o) {
    if (a === b || !tieEndExists(doc, a) || !tieEndExists(doc, b)) return null;
    const id = newId(doc, 'e');
    const q = o || {};
    doc.ties[id] = { id, a, b,
      strength: has(TIE_STRENGTHS, q.strength) ? q.strength : 'normal',
      stress: !!q.stress,
      dir: has(TIE_DIRS, q.dir) ? q.dir : '',
      note: str(q.note, 60) };
    return id;
  }
  const tieBetween = (doc, a, b) => Object.values(doc.ties).find(t => (t.a === a && t.b === b) || (t.a === b && t.b === a)) || null;

  // 生態圖模式的「家庭」圓（使用者 2026-10-28：要能拖位置）：拖過就用存下來的位置，沒拖過＝所有人的中間。
  // 它的 id 含冒號，不是合法的資料 id（okId 不收），不會跟人或資源撞號
  const FAMILY_ID = ':family';
  function familyAt(doc) {
    if (doc.familyPos) return { x: doc.familyPos.x, y: doc.familyPos.y };
    const ps = Object.values(doc.persons);
    if (!ps.length) return { x: 0, y: 0 };
    const xs = ps.map(p => p.x), ys = ps.map(p => p.y);
    return { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2 };
  }

  function moveItems(doc, ids, dx, dy) {
    for (const id of ids) {
      if (id === FAMILY_ID) {
        if (Object.keys(doc.persons).length) { const c = familyAt(doc); doc.familyPos = { x: c.x + dx, y: c.y + dy }; }
        continue;
      }
      const o = doc.persons[id] || doc.labels[id] || doc.systems[id];
      if (o) { o.x += dx; o.y += dy; }
    }
  }
  function snapItems(doc, ids) {
    for (const id of ids) {
      const o = id === FAMILY_ID ? doc.familyPos : doc.persons[id] || doc.labels[id] || doc.systems[id];
      if (o) { o.x = snap(o.x); o.y = snap(o.y); }
    }
  }

  // 刪除：人→從所有關係移除；沒有伴侶、或只剩一位伴侶且沒有子女的關係一併刪；情感關係與生活圈同步清理
  function deleteItems(doc, ids) {
    for (const id of new Set(ids)) {
      delete doc.persons[id]; delete doc.unions[id]; delete doc.relations[id];
      delete doc.households[id]; delete doc.labels[id];
      delete doc.systems[id]; delete doc.ties[id];
    }
    for (const u of Object.values(doc.unions)) {
      u.partners = u.partners.filter(p => doc.persons[p]);
      u.children = u.children.filter(c => doc.persons[c.id]);
      pruneTwins(u);
      if (!u.partners.length || (u.partners.length === 1 && !u.children.length)) delete doc.unions[u.id];
    }
    for (const r of Object.values(doc.relations)) if (!doc.persons[r.a] || !doc.persons[r.b]) delete doc.relations[r.id];
    for (const h of Object.values(doc.households)) {
      h.members = h.members.filter(m => doc.persons[m]);
      if (!h.members.length) delete doc.households[h.id];
    }
    // 生態連結：任一端不見了就一起刪（人、資源、生活圈都算）
    for (const t of Object.values(doc.ties)) if (!tieEndExists(doc, t.a) || !tieEndExists(doc, t.b)) delete doc.ties[t.id];
    if (!Object.keys(doc.persons).length) doc.familyPos = null;   // 人都刪光了，家庭圓的位置也不留
  }

  // ── 復原／重做（快照式：每次變更前存整份 JSON；家系圖檔很小，這樣最不容易出錯）──
  class History {
    constructor(max) { this.max = max || 100; this.undoStack = []; this.redoStack = []; }
    push(doc) {
      this.undoStack.push(JSON.stringify(doc));
      if (this.undoStack.length > this.max) this.undoStack.shift();
      this.redoStack = [];
    }
    undo(doc) {
      if (!this.undoStack.length) return null;
      this.redoStack.push(JSON.stringify(doc));
      return JSON.parse(this.undoStack.pop());
    }
    redo(doc) {
      if (!this.redoStack.length) return null;
      this.undoStack.push(JSON.stringify(doc));
      return JSON.parse(this.redoStack.pop());
    }
    clear() { this.undoStack = []; this.redoStack = []; }
